function tsMs(t){ return (t && typeof t.toMillis==='function') ? t.toMillis() : 0; }
function calcSaldoVendedor(regs, saques, excluirSaqueId){
  const devidoDe = function(r){ return r.valorDevidoVendedor!==undefined ? r.valorDevidoVendedor : r.valorVenda; };
  let devido = 0, ultimaLiq = 0;
  regs.forEach(function(r){
    if(r.estado==='DEVIDO') devido += devidoDe(r);
    else if(r.estado==='LIQUIDADO') ultimaLiq = Math.max(ultimaLiq, tsMs(r.liquidadoEm));
  });
  let pendente = 0, pagoSemLiquidar = 0;
  saques.forEach(function(w){
    if(w.id===excluirSaqueId) return;
    if(w.estado==='SOLICITADO' || w.estado==='EM_PROCESSAMENTO') pendente += w.valor;
    else if(w.estado==='PAGO' && tsMs(w.atualizadoEm) > ultimaLiq) pagoSemLiquidar += w.valor;
  });
  const r2 = function(n){ return Math.round(n*100)/100; };
  return { devido:r2(devido), pendente:r2(pendente), pagoSemLiquidar:r2(pagoSemLiquidar),
           disponivel: Math.max(0, r2(devido - pendente - pagoSemLiquidar)) };
}
function saldoDisponivelParaSaque(){
  return calcSaldoVendedor(V1.cache['meusRegistosFinanceiros'] || [], V1.cache['meusSaques'] || []).disponivel;
}
function solicitarSaque(btnEl){
  const valorBruto = parseFloat(document.getElementById('saqueValor').value);
  const metodo = (document.getElementById('saqueMetodo').value || '').trim();
  const dadosRecebimento = (document.getElementById('saqueDados').value || '').trim();
  const errEl = document.getElementById('saqueErr');
  errEl.textContent = '';
  if(!valorBruto || valorBruto<=0){ errEl.textContent = 'Indica um valor válido.'; return; }
  const valor = Math.round(valorBruto*100)/100;
  if(!metodo){ errEl.textContent = 'Indica o método de recebimento.'; return; }
  if(!dadosRecebimento){ errEl.textContent = 'Indica os dados para recebimento (conta/IBAN/carteira).'; return; }
  if(dadosRecebimento.length > 200){ errEl.textContent = 'Os dados de recebimento são demasiado longos.'; return; }
  const saques = V1.cache['meusSaques'] || [];
  if(saques.some(function(w){ return w.estado==='SOLICITADO' || w.estado==='EM_PROCESSAMENTO'; })){
    errEl.textContent = 'Já tens um pedido de saque em aberto. Aguarda a decisão antes de pedir outro.'; return;
  }
  const saldo = saldoDisponivelParaSaque();
  if(valor > saldo){ errEl.textContent = 'O valor excede o teu saldo disponível (' + fmt(saldo) + ' Kz).'; return; }
  runWithLocalLoader(btnEl, 'A solicitar saque…', function(){
    const now = firebase.firestore.FieldValue.serverTimestamp();
    const wRef = fdb.collection('withdrawals').doc();
    const lockRef = fdb.collection('withdrawalLocks').doc(AUTH.uid);
    const batch = fdb.batch();
    batch.set(wRef, { vendedorId: AUTH.uid, valor: valor, moeda: 'AOA', metodo: metodo,
      dadosRecebimento: dadosRecebimento, estado: 'SOLICITADO', criadoEm: now, atualizadoEm: now });
    batch.set(lockRef, { vendedorId: AUTH.uid, withdrawalId: wRef.id, criadoEm: now });
    return batch.commit();
  }, { successText:'Saque solicitado' })
  .then(function(){
    document.getElementById('saqueValor').value=''; document.getElementById('saqueDados').value='';
    v1Invalidate('meusSaques'); render();
  })
  .catch(function(){});
}

function aceitarProposta(projectoId, propostaId, freelancerId, btnEl){
  const projectoRef = fdb.collection('projectos').doc(projectoId);
  const propostaRef = fdb.collection('propostas').doc(propostaId);
  runWithLocalLoader(btnEl, 'A aceitar proposta…', function(){
    return fdb.collection('propostas').where('projectoId','==',projectoId).where('estado','==','PENDENTE').get()
      .then(function(qs){
        const outrosIds = qs.docs.map(function(d){ return d.id; }).filter(function(id){ return id !== propostaId; });
        return fdb.runTransaction(function(tx){
          return tx.get(projectoRef).then(function(pSnap){
            if(!pSnap.exists) throw new Error('Este projecto já não existe.');
            const proj = pSnap.data();
            if(proj.clienteId !== AUTH.uid) throw new Error('Este projecto não te pertence.');
            if(proj.estado !== 'ABERTO' && proj.estado !== 'EM_ANALISE') throw new Error('Este projecto já não está a aceitar propostas.');
            return tx.get(propostaRef).then(function(propSnap){
              if(!propSnap.exists) throw new Error('Esta proposta já não existe.');
              const prop = propSnap.data();
              if(prop.projectoId !== projectoId) throw new Error('Proposta não pertence a este projecto.');
              if(prop.estado !== 'PENDENTE') throw new Error('Esta proposta já foi decidida.');
              return Promise.all(outrosIds.map(function(id){
                return tx.get(fdb.collection('propostas').doc(id));
              })).then(function(outrosSnaps){
                const now = firebase.firestore.FieldValue.serverTimestamp();
                tx.update(projectoRef, { estado:'EM_CURSO', freelancerId: freelancerId, propostaAceitaId: propostaId, atualizadoEm: now });
                tx.update(propostaRef, { estado:'ACEITA', atualizadoEm: now });
                outrosSnaps.forEach(function(snap){
                  if(!snap.exists) return;
                  const d = snap.data();
                  if(d.projectoId === projectoId && d.estado === 'PENDENTE'){
                    tx.update(snap.ref, { estado:'REJEITADA', atualizadoEm: now });
                  }
                });
              });
            });
          });
        });
      });
  }, { successText:'Proposta aceite' })
  .then(function(){
    V1_propostasRecebidasAbertoId = null;
    v1Invalidate('meusProjectosCliente'); v1Invalidate('propostasProjecto:'+projectoId); render();
  })
  .catch(function(){});
}

      if(p.clienteId !== AUTH.uid) throw new Error('Este projecto não te pertence.');
      if(p.estado !== 'ABERTO' && p.estado !== 'EM_ANALISE') throw new Error('Só é possível cancelar antes de aceitar uma proposta.');
      return ref.update({ estado:'CANCELADO', atualizadoEm: firebase.firestore.FieldValue.serverTimestamp() });
    });
  }, { successText:'Projecto cancelado' })
  .then(function(){ v1Invalidate('meusProjectosCliente'); render(); })
  .catch(function(){});
}

const COMISSAO_IP_PERCENT = 0.20;

function adminMarcarPago(pid, vendedorId, valor, moeda, chargeId, btnEl){
  const pedidoRef = fdb.collection('pedidos').doc(pid);
  const registoRef = fdb.collection('registosFinanceiros').doc(pid);
  runWithLocalLoader(btnEl, 'A confirmar pagamento…', function(){
    return fdb.runTransaction(function(tx){
      return tx.get(pedidoRef).then(function(pSnap){
        if(!pSnap.exists) throw new Error('Este pedido já não existe.');
        const p = pSnap.data();
        if(p.estado !== 'AGUARDA_PAGAMENTO' && p.estado !== 'PAGAMENTO_ENVIADO') throw new Error('Este pedido já foi processado (estado actual: ' + p.estado + ').');
        const valorReal = p.valor;
        const vendedorIdReal = p.vendedorId;
        const moedaReal = p.moeda || 'AOA';
        const afiliadoId = (p.afiliadoId && p.afiliadoId !== vendedorIdReal) ? p.afiliadoId : null;
        const pctSnapshot = p.comissaoAfiliadoPercentualSnapshot;
        return Promise.resolve().then(function(){
          const now = firebase.firestore.FieldValue.serverTimestamp();
          const r2 = function(n){ return Math.round(n * 100) / 100; };
          const pctAplicado = (afiliadoId && typeof pctSnapshot === 'number' && pctSnapshot > 0 && pctSnapshot <= AFIL_PCT_MAX) ? pctSnapshot : 0;
          const comissaoIP = r2(valorReal * COMISSAO_IP_PERCENT);
          const comissaoAfiliado = Math.min(r2(valorReal * pctAplicado / 100), Math.max(0, r2(valorReal - comissaoIP)));
          const valorDevidoVendedor = Math.max(0, r2(valorReal - comissaoIP - comissaoAfiliado));
          tx.update(pedidoRef, { estado:'PAGO', 'pagamento.estadoGateway':'PAID', 'pagamento.atualizadoEm':now, atualizadoEm:now });
          tx.set(registoRef, { pedidoId:pid, vendedorId:vendedorIdReal, valorVenda:valorReal, comissaoIP:comissaoIP, valorDevidoVendedor:valorDevidoVendedor, comissaoAfiliado:comissaoAfiliado, moeda:moedaReal, estado:'DEVIDO', referenciaPagamento:chargeId||null, criadoEm:now });
          if(afiliadoId){
            const pct = pctAplicado;
            if(pct > 0){
              tx.set(fdb.collection('affiliateAttributions').doc(pid), {
                pedidoId: pid, afiliadoId: afiliadoId, vendedorId: vendedorIdReal, ofertaId: p.ofertaId||null,
                valorVenda: valorReal, percentagemAplicada: pct, comissaoAfiliado: comissaoAfiliado,
                moeda: moedaReal, estado:'DEVIDO', criadoEm: now
              });
              tx.set(fdb.collection('affiliateStats').doc(afiliadoId), {
                vendasCount: firebase.firestore.FieldValue.increment(1),
                comissaoTotalDevida: firebase.firestore.FieldValue.increment(comissaoAfiliado),
                comissaoTotalPaga: firebase.firestore.FieldValue.increment(0),
                atualizadoEm: now
              }, { merge:true });
            }
          }
        });
      });
    });
  }, { successText:'Marcado como pago' })
  .then(function(){ v1Invalidate('todosPedidosAdmin'); v1Invalidate('todosRegistosFinanceiros'); v1Invalidate('todasAtribuicoesAfiliados'); render(); })
  .catch(function(){});
}

function adminEntregarPedido(pid, ofertaId, btnEl){
  const pedidoRef = fdb.collection('pedidos').doc(pid);
  const privadoRef = fdb.collection('ofertasPrivado').doc(ofertaId);
  runWithLocalLoader(btnEl, 'A liberar entrega…', function(){
    return fdb.runTransaction(function(tx){
      return Promise.all([tx.get(pedidoRef), tx.get(privadoRef)]).then(function(results){
        const pSnap = results[0], privSnap = results[1];
        if(!pSnap.exists) throw new Error('Este pedido já não existe.');
        const p = pSnap.data();
        if(p.estado !== 'PAGO' && p.estado !== 'EM_EXECUCAO') throw new Error('Este pedido já não está em estado Pago/Em execução.');
        const link = privSnap.exists ? (privSnap.data().linkEntrega || '').trim() : '';
        if(!link) throw new Error('Esta oferta ainda não possui um link de entrega configurado.');
        tx.update(pedidoRef, { estado:'ENTREGUE', linkEntregue: link, atualizadoEm: firebase.firestore.FieldValue.serverTimestamp() });
      });
    });
  }, { successText:'Entregue' })
  .then(function(){ v1Invalidate('todosPedidosAdmin'); v1Invalidate('meusPedidos'); render(); })

function adminRevisarVerificacao(reqId, uid, decisao, btnEl){
  let motivo = '';
  if(decisao==='REJECTED'){
    motivo = (prompt('Motivo da rejeição (obrigatório):') || '').trim();
    if(!motivo){ showGlobalToast('Indica o motivo da rejeição.', true); return; }
  } else if(!confirm('Aprovar a verificação deste utilizador?')){ return; }
  runWithLocalLoader(btnEl, decisao==='APPROVED' ? 'A aprovar…' : 'A rejeitar…', function(){
    const now = firebase.firestore.FieldValue.serverTimestamp();
    const reqRef = fdb.collection('verificationRequests').doc(reqId);
    const userRef = fdb.collection('users').doc(uid);
    const profRef = fdb.collection('profiles').doc(uid);
    return profRef.get().then(function(pSnap){
      const audit = fdb.collection('adminAuditLog').doc();
      const batch = fdb.batch();
      const reqUpd = { status: decisao, reviewedBy: AUTH.uid, reviewedAt: now, auditId: audit.id };
      if(motivo) reqUpd.motivo = motivo;
      batch.update(reqRef, reqUpd);
      if(decisao==='APPROVED'){
        batch.update(userRef, { verificationStatus: 'VERIFIED', updatedAt: now, auditId: audit.id });
        if(pSnap.exists) batch.update(profRef, { verificationStatus: 'VERIFIED', updatedAt: now });
      }
      const a = { actor: AUTH.uid, action: 'VERIFICATION_' + decisao, targetType: 'verificationRequest',
                  targetId: reqId, subjectUid: uid, ts: now };
      if(motivo) a.motivo = motivo;
      batch.set(audit, a);
      return batch.commit();
    });
  }, { successText: decisao==='APPROVED' ? 'Aprovado' : 'Rejeitado' })
  .then(function(){ v1Invalidate('verificacoesPendentes'); render(); })
  .catch(function(){});
}

NAV.administracao.subs.saques = 'Saques';
function adminDecidirSaque(id, novoEstado, btnEl){
  const wRef = fdb.collection('withdrawals').doc(id);
  let motivo = '';
  if(novoEstado==='REJEITADO'){
    motivo = (prompt('Motivo da rejeição (obrigatório):') || '').trim();
    if(!motivo){ showGlobalToast('Indica o motivo da rejeição.', true); return; }
  }
  runWithLocalLoader(btnEl, 'A processar…', function(){
    return wRef.get().then(function(snap){
      if(!snap.exists) throw new Error('Este saque já não existe.');
      const w = snap.data();
      if(novoEstado==='EM_PROCESSAMENTO'){
        if(w.estado !== 'SOLICITADO') throw new Error('Este saque já não está em SOLICITADO.');
      } else if(w.estado !== 'SOLICITADO' && w.estado !== 'EM_PROCESSAMENTO'){
        throw new Error('Este saque já foi decidido.');
      }
      let pre = Promise.resolve();
      if(novoEstado==='PAGO'){
        pre = Promise.all([
          fdb.collection('registosFinanceiros').where('vendedorId','==',w.vendedorId).get(),
          fdb.collection('withdrawals').where('vendedorId','==',w.vendedorId).get()
        ]).then(function(r){
          const regs = r[0].docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
          const saques = r[1].docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
          const s = calcSaldoVendedor(regs, saques, id);
          if(w.valor > s.devido){
            throw new Error('Valor superior ao saldo devido a este vendedor (' + fmt(s.devido) + ' Kz). Rejeita o pedido ou corrige os registos.');
          }
          let msg = 'Confirmas que pagaste ' + fmt(w.valor) + ' ' + (w.moeda||'AOA') + ' a este vendedor?\n\nDepois de pagar, liquida em Financeiro os registos correspondentes.';
          if(w.valor > s.disponivel){
            msg = 'ATENÇÃO: já existem ' + fmt(s.pagoSemLiquidar) + ' Kz pagos em saques anteriores sem registos liquidados. Saldo disponível estimado: ' + fmt(s.disponivel) + ' Kz.\n\n' + msg;
          }
          if(!confirm(msg)) throw new Error('Operação cancelada.');
        });
      }
      return pre.then(function(){
        return novoEstado==='EM_PROCESSAMENTO' ? null : fdb.collection('withdrawalLocks').doc(w.vendedorId).get();
      }).then(function(lockSnap){
        const now = firebase.firestore.FieldValue.serverTimestamp();
        const audit = fdb.collection('adminAuditLog').doc();
        const batch = fdb.batch();
        const upd = { estado: novoEstado, atualizadoEm: now, auditId: audit.id };
        if(motivo) upd.observacaoAdmin = motivo;
        batch.update(wRef, upd);
        const a = { actor: AUTH.uid, action: 'WITHDRAWAL_' + novoEstado, targetType: 'withdrawal', targetId: id,
                    subjectUid: w.vendedorId, detalhe: 'valor=' + w.valor, ts: now };
        if(motivo) a.motivo = motivo;
        batch.set(audit, a);
        if(lockSnap && lockSnap.exists && lockSnap.data().withdrawalId === id) batch.delete(lockSnap.ref);
        return batch.commit();
      });
    });
  }, { successText: novoEstado==='PAGO' ? 'Saque pago' : novoEstado==='REJEITADO' ? 'Saque rejeitado' : 'Em processamento' })
  .then(function(){ v1Invalidate('todosSaquesAdmin'); render(); })
  .catch(function(){});
}

  ${v1Note('sem saque de afiliado nesta fase — o módulo Saques (Financeiro → Saques) só cobre o saldo de vendedor em registosFinanceiros. Pagar afiliados ficaria para uma extensão futura.')}`;
};

(function capturarReferralDaURL(){
  try{
    const params = new URLSearchParams(location.search);
    const ref = params.get('ref');
    const ofertaId = params.get('oferta');
    if(ref) sessionStorage.setItem('ipd_ref', ref);
    if(ofertaId){
      ST.section = 'marketplace'; ST.sub = 'digital';
      setTimeout(function(){ abrirDetalheOferta(ofertaId); }, 0);
    }
  }catch(e){  }
})();

function fmtDataHora(ts){
  if(!ts || typeof ts.toDate !== 'function') return '—';
  try{ return ts.toDate().toLocaleString('pt-AO', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){ return '—'; }
}
function conversaIdFor(tipo, referenciaId){ return tipo + '_' + referenciaId; }
function outroParticipante(c){
  if(!Array.isArray(c.participantes)) return '?';
  return c.participantes.find(function(uid){ return uid !== AUTH.uid; }) || '?';
}

let V1_conversaAbertaId = null;

function abrirConversa(conversaId){
  V1_conversaAbertaId = conversaId;
  v1Invalidate('conversa:'+conversaId);
  v1Invalidate('mensagens:'+conversaId);
  go('chat', '_conversa');
}

function abrirOuCriarConversa(tipo, referenciaId, participantes, btnEl){
  if(!AUTH.uid){ openAuth(); return; }
  if(!Array.isArray(participantes) || participantes.length!==2 || !participantes[0] || !participantes[1]){
    console.error('[chat] participantes inválidos', participantes); return;
  }
  if(participantes.indexOf(AUTH.uid)===-1){
    showGlobalToast('Não tens acesso a esta conversa.', true); return;
  }
  const conversaId = conversaIdFor(tipo, referenciaId);
  const ref = fdb.collection('conversas').doc(conversaId);
  runWithLocalLoader(btnEl, 'A abrir conversa…', function(){
    return ref.get().then(function(snap){
      if(snap.exists) return;
      const now = firebase.firestore.FieldValue.serverTimestamp();
      return ref.set({
        participantes: participantes, tipo: tipo, referenciaId: referenciaId,
        ultimaMensagem: '', ultimaMensagemEm: null, naoLidoPor: [],
        criadoEm: now, atualizadoEm: now
      });
    });
  }, {})
  .then(function(){ v1Invalidate('minhasConversas'); abrirConversa(conversaId); })
  .catch(function(){});
}

function marcarConversaComoLida(conversaId, conversa, mensagens){
  const guardaKey = 'chatLido:'+conversaId;
  if(V1.loading[guardaKey]) return;
  const porLer = mensagens.filter(function(m){ return m.remetenteId!==AUTH.uid && m.lida!==true; });
  const euNaoLido = Array.isArray(conversa.naoLidoPor) && conversa.naoLidoPor.indexOf(AUTH.uid)!==-1;
  if(!porLer.length && !euNaoLido) return;
  V1.loading[guardaKey] = true;
  const batch = fdb.batch();
  porLer.forEach(function(m){
    batch.update(fdb.collection('conversas').doc(conversaId).collection('mensagens').doc(m.id), { lida:true });
    m.lida = true;
  });
  if(euNaoLido){
    batch.update(fdb.collection('conversas').doc(conversaId), { naoLidoPor: firebase.firestore.FieldValue.arrayRemove(AUTH.uid) });
    conversa.naoLidoPor = conversa.naoLidoPor.filter(function(u){ return u!==AUTH.uid; });
  }
  batch.commit().catch(function(err){ console.error('[chat] erro ao marcar como lida', err); });
}

function enviarMensagem(conversaId, btnEl){
  if(!AUTH.uid){ openAuth(); return; }
  const inputEl = document.getElementById('chatInput_'+conversaId);
  if(!inputEl) return;
  const texto = (inputEl.value || '').trim();
  if(!texto) return;
  if(texto.length > 2000){ showGlobalToast('Mensagem excede o limite de 2000 caracteres.', true); return; }
  const conversaRef = fdb.collection('conversas').doc(conversaId);
  const msgRef = conversaRef.collection('mensagens').doc();
  const now = firebase.firestore.FieldValue.serverTimestamp();
  runWithLocalLoader(btnEl, 'A enviar…', function(){
    return fdb.runTransaction(function(tx){
      return tx.get(conversaRef).then(function(snap){
        if(!snap.exists) throw new Error('Esta conversa já não existe.');
        const c = snap.data();
        if(!Array.isArray(c.participantes) || c.participantes.indexOf(AUTH.uid)===-1){
          throw new Error('Não tens acesso a esta conversa.');
        }
        const destinatarios = c.participantes.filter(function(uid){ return uid!==AUTH.uid; });
        tx.set(msgRef, { remetenteId: AUTH.uid, texto: texto, criadoEm: now, lida:false });
        tx.update(conversaRef, { ultimaMensagem: texto, ultimaMensagemEm: now, atualizadoEm: now, naoLidoPor: destinatarios });
      });
    });
  }, {})
  .then(function(){
    inputEl.value = '';
    v1Invalidate('mensagens:'+conversaId);
    v1Invalidate('conversa:'+conversaId);
    v1Invalidate('minhasConversas');
    render();
  })
  .catch(function(){});
}

RENDERERS['chat:conversas'] = function(){
  if(!AUTH.uid) return loginGate('Entra para veres as tuas conversas.');
  const key = 'minhasConversas';
  if(V1.cache[key]===undefined){
    v1Fetch(key, function(){ return fdb.collection('conversas').where('participantes','array-contains',AUTH.uid).orderBy('atualizadoEm','desc').limit(60).get(); });
    return skeletonGrid();
  }
  const conversas = V1.cache[key];
  if(!conversas.length) return emptyState(icon('chat'),'Ainda sem conversas','Quando tiveres um projecto de freelancer ou um pedido de serviço em curso, o botão "Chat" aparece nessa página.');
  return conversas.map(function(c){
    const outro = outroParticipante(c);
    const naoLido = Array.isArray(c.naoLidoPor) && c.naoLidoPor.indexOf(AUTH.uid)!==-1;
    return `<div class="chat-list-item" onclick="abrirConversa('${c.id}')">
      <div class="chat-list-avatar">${escHtml((outro||'?').charAt(0).toUpperCase())}</div>
      <div class="chat-list-body">
        <div class="chat-list-name" style="font-family:monospace">${escHtml(outro)}</div>
        <div class="chat-list-preview">${escHtml(c.ultimaMensagem || 'Sem mensagens ainda')}</div>
      </div>
      <div class="chat-list-meta">
        <span class="chat-list-time">${fmtDataHora(c.ultimaMensagemEm)}</span>
        ${naoLido ? '<span class="chat-unread-dot" title="Mensagens por ler"></span>' : ''}
      </div>
    </div>`;
  }).join('');
};

RENDERERS['chat:_conversa'] = function(){
  if(!AUTH.uid) return loginGate('Entra para veres esta conversa.');
  const conversaId = V1_conversaAbertaId;
  if(!conversaId){ setTimeout(function(){ go('chat','conversas'); }, 0); return skeletonGrid(); }

  const convKey = 'conversa:'+conversaId;
  if(V1.cache[convKey]===undefined){
    v1Fetch(convKey, function(){ return fdb.collection('conversas').doc(conversaId).get().then(function(d){ return { docs: d.exists ? [d] : [] }; }); });
    return skeletonGrid();
  }
  const convArr = V1.cache[convKey];
  if(!convArr.length){
    return `<div class="card-desc" style="margin-bottom:12px">Esta conversa já não existe.</div><button class="btn bo bsm" onclick="go('chat','conversas')">← Conversas</button>`;
  }
  const conversa = convArr[0];
  if(!Array.isArray(conversa.participantes) || conversa.participantes.indexOf(AUTH.uid)===-1){
    return `<div class="card-desc" style="margin-bottom:12px">Não tens acesso a esta conversa.</div><button class="btn bo bsm" onclick="go('chat','conversas')">← Conversas</button>`;
  }

  const msgKey = 'mensagens:'+conversaId;
  if(V1.cache[msgKey]===undefined){
    v1Fetch(msgKey, function(){ return fdb.collection('conversas').doc(conversaId).collection('mensagens').orderBy('criadoEm','asc').limit(200).get(); });
    return skeletonGrid();
  }
  const mensagens = V1.cache[msgKey];
  marcarConversaComoLida(conversaId, conversa, mensagens);
  const outro = outroParticipante(conversa);

  setTimeout(function(){
    const box = document.getElementById('chatMessagesBox');
    if(box) box.scrollTop = box.scrollHeight;
  }, 0);

  return `<button class="btn bo bsm" style="margin-bottom:10px" onclick="go('chat','conversas')">← Conversas</button>
  <div class="chat-window">
    <div class="chat-window-head">
      <div class="chat-list-avatar">${escHtml((outro||'?').charAt(0).toUpperCase())}</div>
      <div style="font-family:monospace;font-size:12px;color:#fff">${escHtml(outro)}</div>
    </div>
    <div class="chat-messages" id="chatMessagesBox">
      ${mensagens.length ? mensagens.map(function(m){
        const mine = m.remetenteId===AUTH.uid;
        return `<div class="chat-msg ${mine?'mine':'theirs'}">${escHtml(m.texto)}<span class="chat-msg-time">${fmtDataHora(m.criadoEm)}</span></div>`;
      }).join('') : '<div class="card-desc" style="text-align:center;margin-top:20px">Ainda sem mensagens — diz olá.</div>'}
    </div>
    <div class="chat-input-row">
      <textarea id="chatInput_${conversaId}" rows="1" maxlength="2000" placeholder="Escreve uma mensagem…" onkeydown="if(event.key==='Enter' && !event.shiftKey){ event.preventDefault(); enviarMensagem('${conversaId}', this.nextElementSibling); }"></textarea>
      <button class="btn bv bsm" onclick="enviarMensagem('${conversaId}', this)">Enviar</button>
    </div>
  </div>`;
};

buildNav();
render();
</script>
