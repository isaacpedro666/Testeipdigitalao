<title>IP Digital AO 2.0 — Marketplace</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,500,600&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
<style>
:root{
  --black:#0F172A;--card:#1E293B;--card2:#334155;
  --v:#16A34A;--vlt:#22C55E;--vbtn:#F59E0B;--vxlt:#FEF3C7;--vdim:#92400E;--vbg:#FEF3C7;
  --white:#fff;--off:#020617;
  --g1:#334155;--g2:#475569;--g3:#94A3B8;--g3lt:#CBD5E1;
  --green:#16A34A;--greenh:#15803D;--glt:#DCFCE7;
  --gold:#F59E0B;--goldh:#D97706;
  --red:#DC2626;--rlt:#FEE2E2;
  --petrol:#0E4A55;--petroldim:#0A343C;--petrollt:#5EEAD4;
  --r:22px;--r-lg:26px;--rsm:14px;
  --sh:0 2px 20px rgba(2,6,23,.22),0 1px 3px rgba(2,6,23,.14);
  --shlg:0 16px 48px rgba(2,6,23,.34),0 4px 14px rgba(2,6,23,.18);
  --pagebg:#0F172A;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--pagebg);color:#EDEAF6;font-size:15px;line-height:1.6;min-height:100vh}
h1,h2,h3,.logo,.tit{font-family:'Satoshi',sans-serif;font-weight:700;letter-spacing:-.01em}
button,input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--g2);border-radius:3px}
img{display:block;max-width:100%}

/* ── TOP BAR ── */
.topbar{position:sticky;top:0;z-index:200;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(15,23,42,.88);backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid rgba(255,255,255,.06)}
.logo{display:flex;align-items:center;gap:10px;font-size:19px;color:#fff;cursor:pointer;user-select:none}
.logo .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--v),var(--vlt));display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0}
.logo b{color:var(--vlt)}
.top-r{display:flex;align-items:center;gap:10px}
.role-switch{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--g1);border-radius:999px;padding:5px 6px 5px 12px;font-size:12.5px;color:var(--g3lt)}
.role-switch select{background:none;border:none;color:#fff;font-size:12.5px;font-weight:700;outline:none;cursor:pointer}
.role-switch select option{background:var(--card)}
.icon-btn{width:38px;height:38px;border-radius:10px;background:var(--card);border:1px solid var(--g1);display:flex;align-items:center;justify-content:center;color:var(--g3lt);cursor:pointer;position:relative;flex-shrink:0}
.icon-btn:hover{border-color:var(--vbtn);color:#fff}
.dot-badge{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid var(--black)}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--vdim),var(--v));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;cursor:pointer;flex-shrink:0}

/* ── LAYOUT: SIDEBAR + CONTENT ── */
.shell{display:flex;min-height:calc(100vh - 60px)}
.sidebar{width:230px;flex-shrink:0;border-right:1px solid var(--g1);padding:18px 12px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
.sec-group{margin-bottom:6px}
.sec-btn{width:100%;display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;background:none;border:none;color:var(--g3lt);font-size:13.5px;font-weight:600;cursor:pointer;text-align:left;transition:background .15s,color .15s}
.sec-btn .ic{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.sec-btn:hover{background:var(--card);color:#fff}
.sec-btn.active{background:var(--card);color:#fff;box-shadow:inset 3px 0 0 var(--vbtn)}
.sub-list{display:none;flex-direction:column;padding:2px 0 8px 30px;gap:1px}
.sub-list.open{display:flex}
.sub-btn{padding:8px 10px;border-radius:8px;background:none;border:none;color:var(--g3);font-size:12.5px;font-weight:600;cursor:pointer;text-align:left}
.sub-btn:hover{color:#fff}
.sub-btn.active{color:var(--vlt);background:rgba(22,163,74,.1)}
.sidebar-toggle{display:none}

.content{flex:1;min-width:0;padding:28px clamp(16px,3vw,40px) 80px}
.crumb{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--vlt);margin-bottom:6px}
.page-tit{font-size:28px;margin-bottom:6px;color:#fff}
.page-sub{font-size:13.5px;color:var(--g3lt);margin-bottom:26px;max-width:640px}

/* ── CARDS / GRID ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--g1);border-radius:var(--r);padding:18px;box-shadow:var(--sh);transition:transform .18s,box-shadow .18s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shlg)}
.card-ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:12px;background:rgba(22,163,74,.15)}
.card-tit{font-family:'Satoshi',sans-serif;font-weight:700;font-size:14.5px;color:#fff;margin-bottom:4px}
.card-desc{font-size:12.5px;color:var(--g3lt);line-height:1.5;margin-bottom:12px}
.card-foot{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--g3)}
.pill{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 9px;border-radius:20px}
.pill-v{background:var(--vbg);color:var(--vdim)}
.pill-g{background:var(--glt);color:var(--green)}
.pill-p{background:rgba(14,74,85,.35);color:var(--petrollt)}
.pill-r{background:var(--rlt);color:var(--red)}
.pill-n{background:var(--card2);color:var(--g3lt)}

/* ── TOAST — confirmação/erro breve após a operação terminar ── */
.gtoast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:901;padding:12px 20px;border-radius:14px;font-size:13px;font-weight:700;box-shadow:var(--shlg);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center}
.gtoast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.gtoast-ok{background:var(--glt);color:var(--green);border:1px solid var(--vlt)}
.gtoast-err{background:var(--rlt);color:var(--red);border:1px solid var(--red)}

/* ═══ LOADER GLOBAL OFICIAL — IP Digital AO (referência visual oficial,
   fundo azul-marinho, badge IP + anel verde, wordmark, barra
   indeterminada). Um único visual, reutilizado em todas as operações
   críticas — nunca recriar outro. ═══ */
.gl-overlay{display:none;position:fixed;inset:0;z-index:900;background:var(--black);align-items:center;justify-content:center;padding:20px}
.gl-overlay.open{display:flex}
.gl-center{display:flex;flex-direction:column;align-items:center}
.gl-badge-wrap{position:relative;width:88px;height:88px;display:flex;align-items:center;justify-content:center;margin-bottom:22px}
.gl-ring{position:absolute;inset:0;border-radius:50%;border:2.5px solid rgba(148,163,184,.15);border-top-color:var(--v);border-right-color:var(--vlt);animation:gl-ring-spin 1.1s linear infinite;box-shadow:0 0 18px rgba(34,197,94,.22)}
.gl-badge{width:56px;height:56px;border-radius:14px;background:#0B1220;border:1.5px solid rgba(34,197,94,.4);display:flex;align-items:center;justify-content:center;font-family:'Satoshi',sans-serif;font-weight:700;font-size:20px;color:#fff;letter-spacing:.5px;box-shadow:inset 0 0 14px rgba(34,197,94,.18)}
.gl-wordmark{font-family:Georgia,'Times New Roman',serif;font-size:14px;letter-spacing:3.5px;color:#EDEAF6;text-transform:uppercase;margin-bottom:14px}
.gl-wordmark span{color:var(--vlt)}
.gl-bar{width:150px;height:3px;border-radius:3px;background:rgba(148,163,184,.18);overflow:hidden;margin-bottom:10px;position:relative}
.gl-bar-fill{position:absolute;top:0;left:-35%;height:100%;width:35%;border-radius:3px;background:linear-gradient(90deg,var(--v),var(--vlt));animation:gl-bar-indeterminate 1.4s ease-in-out infinite}
.gl-status{font-size:12.5px;color:var(--g3lt);letter-spacing:.3px}
@keyframes gl-ring-spin{to{transform:rotate(360deg)}}
@keyframes gl-bar-indeterminate{0%{left:-35%;width:35%}50%{left:35%;width:45%}100%{left:100%;width:35%}}
@media(prefers-reduced-motion:reduce){
  .gl-ring{animation-duration:2.6s}
  .gl-bar-fill{animation:none;left:0;width:100%;opacity:.55}
}

/* ═══ LOADER LOCAL — por botão/componente, para acções menores (guardar
   nome/telefone, activar/cancelar/desactivar papel, aprovar, rejeitar,
   guardar configurações). Nunca ocupa o ecrã inteiro. ═══ */
/* ═══ LOADER LOCAL — o MESMO Loader Principal (badge IP + anel + wordmark
   + barra), reduzido via CSS para caber como cartão flutuante centrado
   sobre o ecrã. Não escurece o fundo (só o Loader Global faz isso) —
   por isso o resto da página continua visível. Não é outro design: é
   literalmente a mesma marcação/classes do Loader Principal, com um
   modificador de escala. ═══ */
.gl-overlay--local{background:transparent}
.gl-center--local{background:var(--black);border:1px solid rgba(34,197,94,.35);border-radius:16px;padding:20px 26px;box-shadow:0 14px 34px rgba(0,0,0,.5);transform:scale(.62)}
@media(prefers-reduced-motion:reduce){.gl-center--local{transform:scale(.62)}}

/* ═══ SKELETON LOADING — base reutilizável, preparada para o redesign
   (listas de produtos/serviços/pedidos/notificações). Não usada ainda
   em nenhuma página real desta fase. ═══ */
.skel{position:relative;overflow:hidden;background:var(--card2);border-radius:8px}
.skel::after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);animation:skel-shimmer 1.5s ease-in-out infinite}
@keyframes skel-shimmer{100%{transform:translateX(100%)}}
.skel-line{height:12px;margin-bottom:8px}
.skel-line.w-40{width:40%}
.skel-line.w-60{width:60%}
.skel-line.w-80{width:80%}
.skel-circle{border-radius:50%}
.skel-card{border-radius:var(--r);padding:16px;background:var(--card);border:1px solid var(--g1)}
@media(prefers-reduced-motion:reduce){.skel::after{animation:none;opacity:.3;background:rgba(255,255,255,.05);transform:none}}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:26px}
.stat-card{background:var(--card);border:1px solid var(--g1);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh)}
.stat-lbl{font-size:11px;color:var(--g3lt);font-weight:600;margin-bottom:6px}
.stat-val{font-family:'Satoshi',sans-serif;font-weight:700;font-size:24px;color:#fff}
.stat-val small{font-size:12px;color:var(--g3lt);font-weight:500}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 18px;border-radius:11px;font-size:13px;font-weight:700;border:none;cursor:pointer;transition:all .18s}
.btn:hover{transform:translateY(-1px)}
.bv{background:linear-gradient(135deg,#16A34A,#15803D);color:#fff}
.bo{background:rgba(255,255,255,.05);color:#EDEAF6;border:1.5px solid rgba(245,158,11,.4)}
.bo:hover{border-color:var(--vbtn);background:rgba(245,158,11,.1)}
.bsm{padding:7px 13px;font-size:12px}

.tab-row{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.tab-chip{padding:8px 15px;border-radius:999px;background:var(--card);border:1.5px solid var(--g1);color:var(--g3lt);font-size:12.5px;font-weight:700;cursor:pointer}
.tab-chip.active{background:var(--black);border-color:var(--vbtn);color:#fff}

.empty{text-align:center;padding:56px 20px;color:var(--g3);border:1.5px dashed var(--g1);border-radius:var(--r)}
.empty .ei{font-size:38px;margin-bottom:10px}
.empty p{font-size:13px;max-width:340px;margin:0 auto}

.table-wrap{background:var(--card);border:1px solid var(--g1);border-radius:var(--r);overflow:hidden;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px}
th{text-align:left;padding:12px 16px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--g3lt);border-bottom:1.5px solid var(--g1);background:var(--off)}
td{padding:12px 16px;font-size:13px;border-bottom:1px solid var(--g1)}
tr:last-child td{border-bottom:none}

.badge-role{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--card2);color:var(--g3lt);border:1px solid var(--g1)}
.badge-role.on{background:var(--vbg);color:var(--vdim);border-color:var(--vlt)}

.mock-note{display:flex;gap:10px;align-items:flex-start;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);border-radius:var(--rsm);padding:12px 14px;margin-bottom:22px;font-size:12px;color:var(--g3lt)}
.mock-note b{color:var(--vbtn)}

.page{display:none}
.page.active{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ── mobile ── */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:250;background:rgba(30,41,59,.92);backdrop-filter:blur(16px);border-top:1px solid var(--g1);padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--g3lt);font-size:9.5px;font-weight:700;padding:6px 4px;cursor:pointer;flex:1}
.bn-item .ic{font-size:18px}
.bn-item.active{color:var(--vlt)}
@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:60px;bottom:0;z-index:190;background:var(--black);transform:translateX(-100%);transition:transform .25s ease;box-shadow:var(--shlg);width:250px}
  .sidebar.open{transform:translateX(0)}
  .sidebar-toggle{display:flex;width:38px;height:38px;border-radius:10px;background:var(--card);border:1px solid var(--g1);align-items:center;justify-content:center;color:#fff;cursor:pointer;flex-shrink:0}
  .content{padding-bottom:90px}
  .bottom-nav{display:flex}
  .role-switch span{display:none}
}
@media(max-width:600px){
  .stat-row{grid-template-columns:repeat(2,1fr)}
  .page-tit{font-size:23px}
}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(2,6,23,.6);z-index:180}
.sidebar-overlay.open{display:block}

/* ── AUTH MODAL ── */
.auth-overlay{display:none;position:fixed;inset:0;background:rgba(2,6,23,.72);z-index:400;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.auth-overlay.open{display:flex}
.auth-modal{background:var(--card);border:1px solid var(--g1);border-radius:var(--r-lg);box-shadow:var(--shlg);width:100%;max-width:380px;padding:24px}
.auth-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.auth-head .modal-x{background:none;border:none;color:var(--g3lt);font-size:19px;cursor:pointer;line-height:1}
.auth-tabs{display:flex;gap:6px;background:var(--off);border-radius:12px;padding:4px;margin-bottom:16px}
.auth-tab{flex:1;padding:9px;border-radius:9px;background:none;border:none;color:var(--g3lt);font-weight:700;font-size:12.5px;cursor:pointer}
.auth-tab.active{background:var(--black);color:#fff}
.auth-input{width:100%;padding:12px 14px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--g2);background:var(--off);color:#fff;font-size:13.5px;outline:none}
.auth-input:focus{border-color:var(--v)}
.auth-err{font-size:12px;color:var(--red);margin-bottom:10px;min-height:14px}
.auth-link{display:block;width:100%;text-align:center;background:none;border:none;color:var(--vlt);font-size:12px;font-weight:600;cursor:pointer;margin-top:12px}

/* ── AUTH GATE (secções que precisam de login) ── */
.gate-card{max-width:420px;background:var(--card);border:1px solid var(--g1);border-radius:var(--r);padding:26px;text-align:center}
.gate-card .gi{font-size:36px;margin-bottom:12px}
.gate-card .gi svg{width:36px;height:36px}

/* ── Ícones SVG (biblioteca ÍCONS) dentro dos contentores existentes:
   mesma lógica de tamanho que os emoji tinham antes, agora explícita. ── */
.card-ic{color:var(--v)}
.card-ic svg{width:20px;height:20px}
.icon-btn svg{width:18px;height:18px}
.ic svg{width:1em;height:1em;display:block}

/* ── PILL DE PAPEL ── */
.role-chip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--g1);border-radius:20px;padding:6px 13px;font-size:12px;font-weight:700;color:var(--g3lt);cursor:pointer;transition:all .15s}
.role-chip.on{background:var(--vbg);color:var(--vdim);border-color:var(--vlt)}
.role-chip[disabled]{opacity:.45;cursor:not-allowed}
.status-badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:20px}
.status-UNVERIFIED{background:var(--card2);color:var(--g3lt)}
.status-PENDING{background:var(--vbg);color:var(--vdim)}
.status-VERIFIED{background:var(--glt);color:var(--green)}
.status-REJECTED{background:var(--rlt);color:var(--red)}
/* ═══ MURAL DO FUNDADOR — secção institucional, escopada a .founder-mural.
   Nenhuma variável/estilo global alterado; reutiliza --card, --g1, --r-lg,
   --sh/--shlg, --vlt, --g3lt já existentes. ═══ */
.founder-mural{display:flex;flex-direction:column;gap:22px;background:var(--card);border:1px solid var(--g1);border-radius:var(--r-lg);padding:26px;margin-top:32px;box-shadow:var(--sh)}
.founder-mural-photo{width:100%;max-width:220px;margin:0 auto;border-radius:var(--r);overflow:hidden;box-shadow:var(--shlg);flex-shrink:0}
.founder-mural-photo img{width:100%;height:auto;display:block}
.founder-mural-eyebrow{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--vlt);margin-bottom:6px}
.founder-mural-name{font-family:'Satoshi',sans-serif;font-weight:700;font-size:20px;color:#fff;margin-bottom:2px}
.founder-mural-role{font-size:13px;color:var(--g3lt);margin-bottom:14px}
.founder-mural-text{font-size:13.5px;line-height:1.7;color:var(--g3lt);max-width:560px}
@media(min-width:760px){
  .founder-mural{flex-direction:row;align-items:center;gap:36px;padding:36px}
  .founder-mural-photo{margin:0}
  .founder-mural-body{flex:1}
}
.brand-mark-img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
.app-footer{border-top:1px solid var(--g1);padding:24px clamp(16px,3vw,40px) calc(24px + 60px);display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;color:var(--g3lt);font-size:12.5px}
.app-footer .mark{width:26px;height:26px;border-radius:8px;overflow:hidden}
.app-footer-links{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.app-footer-links button{background:none;border:none;color:var(--g3lt);font-size:12.5px;cursor:pointer;padding:0}
.app-footer-links button:hover{color:var(--vlt)}
/* ═══ HOMEPAGE (Marketplace → Digital, a única página pública) —
   Hero / Categorias / Como Funciona / Confiança / CTA. Tudo escopado
   a estas classes, reutilizando --card/--g1/--r/--vlt/--g3lt já
   existentes. Nenhum estilo global alterado. ═══ */
.mkt-hero{padding:8px 0 24px;text-align:center;max-width:640px;margin:0 auto}
.mkt-hero-title{font-family:'Satoshi',sans-serif;font-weight:700;font-size:clamp(22px,4vw,30px);color:#fff;margin-bottom:10px;line-height:1.25}
.mkt-hero-sub{font-size:14px;color:var(--g3lt);line-height:1.6}
.mkt-cats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:28px}
.mkt-cat{background:var(--card);border:1px solid var(--g1);border-radius:var(--r);padding:14px;text-align:center;font-size:13px;font-weight:700;color:#fff}
.mkt-cat span{display:block;font-size:11px;font-weight:500;color:var(--g3lt);margin-top:4px}
.mkt-cat.active{border-color:var(--vlt)}
.mkt-cat.soon{opacity:.55}
.mkt-info{margin-top:36px}
.mkt-info-title{font-family:'Satoshi',sans-serif;font-weight:700;font-size:17px;color:#fff;margin-bottom:16px;text-align:center}
.mkt-steps{display:grid;grid-template-columns:1fr;gap:12px}
.mkt-step{background:var(--card);border:1px solid var(--g1);border-radius:var(--r);padding:16px}
.mkt-step-n{width:26px;height:26px;border-radius:8px;background:var(--vlt);color:#fff;font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.mkt-step-t{font-weight:700;color:#fff;font-size:13.5px;margin-bottom:4px}
.mkt-step-d{font-size:12.5px;color:var(--g3lt);line-height:1.5}
.mkt-trust-list{list-style:none;display:flex;flex-direction:column;gap:10px;max-width:560px;margin:0 auto}
.mkt-trust-list li{background:var(--card);border:1px solid var(--g1);border-radius:var(--r);padding:12px 16px;font-size:13px;color:var(--g3lt)}
.mkt-cta{margin-top:36px;text-align:center;background:var(--card);border:1px solid var(--g1);border-radius:var(--r-lg);padding:28px}
.mkt-cta-t{font-family:'Satoshi',sans-serif;font-weight:700;font-size:16px;color:#fff;margin-bottom:6px}
.mkt-cta-d{font-size:13px;color:var(--g3lt);margin-bottom:16px}
@media(min-width:640px){
  .mkt-cats{grid-template-columns:repeat(4,1fr)}
  .mkt-steps{grid-template-columns:repeat(4,1fr)}
}
@media(min-width:760px){.app-footer{padding-bottom:24px}}
</style>

<!-- ═══ LOADER GLOBAL OFICIAL — IP Digital AO ═══
     Visual fixo (referência oficial): badge "IP" + anel verde a girar,
     wordmark "IP DIGITAL.AO", barra indeterminada, texto de estado.
     Usado APENAS para operações críticas/bloqueantes (auth, bootstrap
     de sessão, operações administrativas importantes) — nunca para
     acções pequenas (ver Loader Local, por botão). -->
<div class="gl-overlay" id="globalLoader" aria-hidden="true">
  <div class="gl-center" role="status" aria-live="polite">
    <div class="gl-badge-wrap">
      <div class="gl-ring"></div>

    <div class="gl-status" id="globalLoaderMsg">Carregando...</div>

</div>

<!-- ═══ LOADER LOCAL — o MESMO Loader Principal acima (idêntica
     estrutura: badge "IP" + anel + wordmark + barra + texto), apenas
     reduzido de escala via CSS. Fica centrado sobre o conteúdo actual,
     que continua visível ao fundo (sem o fundo escuro do Loader
     Global) — usado para acções pontuais (guardar nome/telefone,
     activar/cancelar/desactivar papel, pedir verificação, logout). -->
<div class="gl-overlay gl-overlay--local" id="localLoader" aria-hidden="true">
  <div class="gl-center gl-center--local" role="status" aria-live="polite">

    <div class="gl-bar"><div class="gl-bar-fill"></div></div>
    <div class="gl-status" id="localLoaderMsg">A processar…</div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   IP DIGITAL AO 2.0 — SKELETON
   Frontend puro. Sem Firebase, sem escrita real de dinheiro.
   Dados: mock estático + localStorage para estado de navegação/UI.
   Objectivo: validar IA (informação/arquitectura) e fluxos, não é o produto final.
   ══════════════════════════════════════════════════════════════ */

const ROLE_LABELS = {
  CUSTOMER:'Comprador', SELLER:'Vendedor', AFFILIATE:'Afiliado',
  SERVICE_PROVIDER:'Prestador de Serviço', FREELANCER:'Freelancer', ADMIN:'Admin'
};
const SELF_SERVICE_ROLES = ['CUSTOMER','SELLER','AFFILIATE','SERVICE_PROVIDER','FREELANCER'];

/* ══════════════════════════════════════════════════════════════
   FIREBASE — projecto de TESTE dedicado (ip-digital-ao-teste),
   separado do projecto de produção. Usa exactamente a Fase 1:
   Authentication + Firestore + Cloud Functions. Realtime Database
   não faz parte do escopo actual — o databaseURL fornecido na
   configuração da consola NÃO é usado aqui de propósito.
   ══════════════════════════════════════════════════════════════ */
const firebaseConfig = {
  apiKey: "AIzaSyACJT6veQgZlChAAlnnaflDOpsqdKPKGvY",
  authDomain: "ip-digital-ao-teste.firebaseapp.com",
  projectId: "ip-digital-ao-teste",
  storageBucket: "ip-digital-ao-teste.firebasestorage.app",
  messagingSenderId: "272795772529",
  appId: "1:272795772529:web:e238612cd83cd441fe1dd0"
};
firebase.initializeApp(firebaseConfig);
const fbAuth = firebase.auth();
const fdb = firebase.firestore();
const fbFunctions = firebase.functions();

/* ══════════════ DIAGNÓSTICO TEMPORÁRIO — REMOVER DEPOIS ══════════════
   Regista, com timestamp relativo, exactamente onde o fluxo de auth
   está — tanto na consola (para inspeção via chrome://inspect / USB
   debugging) como visivelmente no próprio ecrã (para quando só há o
   telemóvel, sem DevTools ligado). Não muda nenhum comportamento. */
window.__diagStart = null;
window.__diagLastStep = null;
function diagLog(step, extra){
  if(window.__diagStart===null) window.__diagStart = performance.now();
  const ms = Math.round(performance.now() - window.__diagStart);
  window.__diagLastStep = step + ' (+' + ms + 'ms)';
  console.log('[DIAG +' + ms + 'ms] ' + step, extra!==undefined ? extra : '');
}
/* ═══════════════════════════════════════════════════════════════════ */

let AUTH = { user:null, uid:null, userDoc:null, profileDoc:null, isAdmin:false, hasPendingVerification:false, ready:false };

function openAuth(){ document.getElementById('authOverlay').classList.add('open'); document.getElementById('authErr').style.color='var(--red)'; }
function closeAuth(){ document.getElementById('authOverlay').classList.remove('open'); document.getElementById('authErr').textContent=''; }
let authTab='login';
function setAuthTab(t){
  authTab=t;
  document.getElementById('tabLogin').classList.toggle('active', t==='login');
  document.getElementById('tabSignup').classList.toggle('active', t==='signup');
  document.getElementById('authFieldsSignup').style.display = t==='signup' ? 'block' : 'none';
  document.getElementById('authSubmitBtn').textContent = t==='signup' ? 'Criar Conta' : 'Entrar';
  document.getElementById('authErr').textContent='';
}
function translateAuthError(code){
  const m = {
    'auth/email-already-in-use':'Este email já tem conta. Tenta entrar.',
    'auth/invalid-email':'Email inválido.',
    'auth/weak-password':'A palavra-passe precisa de pelo menos 6 caracteres.',
    'auth/wrong-password':'Palavra-passe incorreta.',
    'auth/invalid-credential':'Email ou palavra-passe incorretos.',
    'auth/user-not-found':'Não existe conta com este email.',
    'auth/too-many-requests':'Demasiadas tentativas. Espera um pouco e tenta de novo.',
    'auth/network-request-failed':'Sem ligação à internet.',
    'auth/operation-not-allowed':'O registo por email/palavra-passe ainda não está activado neste projecto Firebase (Authentication → Sign-in method).',
    'auth/api-key-not-valid.-please-pass-a-valid-api-key.':'A chave de API do Firebase não é válida para este projecto.'
  };
  // Fallback inclui o código real do erro em vez de uma frase genérica —
  // sem isto, qualquer erro fora da lista acima aparecia como texto vago
  // e era fácil de confundir com "não aconteceu nada".
  return m[code] || ('Não foi possível concluir' + (code ? ' (' + code + ')' : '') + '. Verifica a tua ligação à internet ou tenta novamente.');
}
function submitAuth(){
  const errEl = document.getElementById('authErr');
  const btn = document.getElementById('authSubmitBtn');
  if(btn.disabled) return; // guarda de duplo clique — uma tentativa já em curso
  errEl.style.color='var(--red)'; errEl.textContent='';
  let email, pass;
  try{
    email = document.getElementById('authEmail').value.trim();
    pass = document.getElementById('authPass').value;
  }catch(e){
    // Qualquer erro síncrono inesperado (ex: elemento em falta, SDK Firebase
    // mal inicializado) fica visível ao utilizador em vez de morrer
    // silenciosamente só na consola do navegador.
    console.error('Erro inesperado no formulário de autenticação:', e);
    errEl.textContent = 'Erro inesperado: ' + (e && e.message ? e.message : 'tenta recarregar a página.');
    return;
  }
  if(!email || !pass){ errEl.textContent='Preenche email e palavra-passe.'; return; }

  window.__diagStart = performance.now(); // reinicia o cronómetro de diagnóstico a cada tentativa
  btn.disabled = true; // guarda de duplo clique imediata — mesmo antes do loader global aparecer (anti-flicker atrasa o visual, não a protecção)

  // Guarda de segurança adicional: sem isto, se o pedido ao Firebase ficasse
  // pendurado (rede instável, comum ao abrir este ficheiro localmente em vez
  // de via Hosting), o botão ficava bloqueado para sempre e NADA aparecia no
  // ecrã. Ao fim de 15s mostra um erro visível e liberta a interface —
  // independente do runWithGlobalLoader, como rede de segurança extra.
  let settled = false;
  const timeoutId = setTimeout(function(){
    if(settled) return;
    settled = true;
    hideGlobalLoader();
    btn.disabled = false;
    errEl.style.color='var(--red)';
    errEl.textContent = 'BLOQUEADO em: ' + window.__diagLastStep + ' — sem resposta em 15s.';
    console.warn('[DIAG] TIMEOUT — última etapa registada:', window.__diagLastStep);
  }, 15000);

  diagLog(authTab==='signup' ? 'AUTH STEP A START (createUserWithEmailAndPassword)' : 'AUTH STEP D START (signInWithEmailAndPassword)');

  // Sequência exacta pedida: validação (acima) → mostrar loader global →
  // Firebase Authentication → bootstrap dos documentos Firestore →
  // sucesso/erro → esconder loader (sempre via .finally() dentro de
  // runWithGlobalLoader — nunca um caminho que o deixe preso no ecrã).
  runWithGlobalLoader(authTab==='signup' ? 'A criar a tua conta…' : 'A entrar…', function(){
    return authTab==='signup'
      ? fbAuth.createUserWithEmailAndPassword(email, pass).then(function(cred){
          diagLog('AUTH STEP A SUCCESS (createUserWithEmailAndPassword)', {uid: cred.user.uid});
          const name = document.getElementById('authName').value.trim() || 'Utilizador';
          diagLog('AUTH STEP A2 START (updateProfile)');
          return cred.user.updateProfile({displayName:name}).then(function(){
            diagLog('AUTH STEP A2 SUCCESS (updateProfile)');
            return bootstrapUserDocs(cred.user, name);
          });
        })
      : fbAuth.signInWithEmailAndPassword(email, pass).then(function(cred){
          diagLog('AUTH STEP D SUCCESS (signInWithEmailAndPassword)', {uid: cred.user.uid});
          return cred;
        });
  }, authTab==='signup' ? 'Conta criada com sucesso.' : 'Sessão iniciada.')
  .then(function(){
    if(settled) return;
    settled = true; clearTimeout(timeoutId);
    diagLog('FLOW COMPLETE — closeAuth()');
    closeAuth();
  })
  .catch(function(err){
    if(settled) return;
    settled = true; clearTimeout(timeoutId);
    // DIAGNÓSTICO: mostra o erro REAL, sem mascarar em texto genérico.
    // runWithGlobalLoader já mostrou um toast; isto acrescenta o detalhe
    // completo no próprio formulário, para depuração.
    diagLog('FLOW FAILED', {code: err && err.code, message: err && err.message});
    console.error('Erro de autenticação/registo (detalhe completo):', err);
    errEl.style.color='var(--red)';
    errEl.textContent = 'Falhou em: ' + window.__diagLastStep.split(' (+')[0] +
      ' | code: ' + (err && err.code || '(sem code)') +
      ' | message: ' + (err && err.message || '(sem message)');
  })
  .finally(function(){
    if(!settled){ settled = true; clearTimeout(timeoutId); }
    btn.disabled = false;
  });
}
function doPasswordReset(){
  const email = document.getElementById('authEmail').value.trim();
  const errEl = document.getElementById('authErr');
  if(!email){ errEl.style.color='var(--red)'; errEl.textContent='Escreve o teu email no campo acima primeiro.'; return; }
  runWithGlobalLoader('A enviar email de recuperação…', function(){
    return fbAuth.sendPasswordResetEmail(email);
  }).then(function(){
    errEl.style.color='var(--vlt)'; errEl.textContent='✅ Email de recuperação enviado.';
  }).catch(function(err){
    errEl.style.color='var(--red)'; errEl.textContent=translateAuthError(err.code);
  });
}
/* Logout usa o Loader Minimizado (não o ecrã inteiro) — é uma acção
   local ao botão que a despoletou, com uma operação Firebase real
   (signOut()) por trás, não um efeito instantâneo. */
function logout(btnEl){
  runWithLocalLoader(btnEl, 'A terminar sessão…', function(){
    return fbAuth.signOut();
  }, { successText: 'Sessão terminada' }).catch(function(){ /* runWithLocalLoader já mostrou o erro real (toast) */ });
}

/* Cria users/{uid} + profiles/{uid} na primeira vez que a conta existe.
   Valores de arranque batem exactamente com o que as Firestore rules exigem
   em "allow create" — se não baterem, a escrita é recusada pelo servidor. */
function bootstrapUserDocs(user, nameOverride){
  const uid = user.uid;
  const now = firebase.firestore.FieldValue.serverTimestamp();
  const userRef = fdb.collection('users').doc(uid);
  diagLog('FIRESTORE STEP E START (get users/{uid})', {uid});
  return userRef.get().then(function(snap){
    diagLog('FIRESTORE STEP E SUCCESS (get users/{uid})', {exists: snap.exists});
    if(snap.exists) return;
    const baseUser = {
      uid, name: nameOverride || user.displayName || '', email: user.email || '',
      phone: user.phoneNumber || '', photoURL: user.photoURL || '',
      roles: ['CUSTOMER'], status: 'active', verificationStatus: 'UNVERIFIED',
      ipScore: 0, rating: 0,
      // ROLE ≠ STATUS COMERCIAL: nasce sempre 'NONE'. Só passa a 'PENDING'
      // pelo trigger de servidor onUserRolesChanged quando o utilizador
      // ativar SELLER/SERVICE_PROVIDER/FREELANCER em "Gerir papéis".
      sellerStatus: 'NONE', serviceProviderStatus: 'NONE', freelancerStatus: 'NONE',
      createdAt: now, updatedAt: now
    };
    diagLog('FIRESTORE STEP B START (set users/{uid})');
    return userRef.set(baseUser).then(function(){
      diagLog('FIRESTORE STEP B SUCCESS (set users/{uid})');
      diagLog('FIRESTORE STEP C START (set profiles/{uid})');
      return fdb.collection('profiles').doc(uid).set({
        uid, displayName: baseUser.name, photoURL: baseUser.photoURL, bio:'', location:'', specialties:[],
        verificationStatus:'UNVERIFIED', ipScore:0, rating:0, salesCount:0, createdAt: now, updatedAt: now
      }).then(function(){ diagLog('FIRESTORE STEP C SUCCESS (set profiles/{uid})'); });
    });
  });
}

function loadAuthState(user){
  if(!user){
    AUTH = {user:null,uid:null,userDoc:null,profileDoc:null,isAdmin:false,hasPendingVerification:false,ready:true};
    renderTopbar(); buildNav(); render();
    return Promise.resolve();
  }
  diagLog('SESSION STEP H0 START (bootstrapUserDocs dentro de loadAuthState)');
  return bootstrapUserDocs(user).then(function(){
    diagLog('SESSION STEP H START (getIdTokenResult)');
    diagLog('SESSION STEP E2 START (get users/{uid}, via loadAuthState)');
    diagLog('SESSION STEP F START (get profiles/{uid})');
    diagLog('SESSION STEP G START (query verificationRequests PENDING)');
    return Promise.all([
      user.getIdTokenResult().then(function(r){ diagLog('SESSION STEP H SUCCESS (getIdTokenResult)'); return r; }),
      fdb.collection('users').doc(user.uid).get().then(function(r){ diagLog('SESSION STEP E2 SUCCESS (get users/{uid})'); return r; }),
      fdb.collection('profiles').doc(user.uid).get().then(function(r){ diagLog('SESSION STEP F SUCCESS (get profiles/{uid})'); return r; }),
      fdb.collection('verificationRequests').where('uid','==',user.uid).where('status','==','PENDING').limit(1).get()
        .then(function(r){ diagLog('SESSION STEP G SUCCESS (query verificationRequests)'); return r; })
    ]);
  }).then(function(results){
    const tokenResult = results[0], uSnap = results[1], pSnap = results[2], vSnap = results[3];
    AUTH = {
      user, uid:user.uid,
      userDoc: uSnap.exists ? uSnap.data() : null,
      profileDoc: pSnap.exists ? pSnap.data() : null,
      isAdmin: tokenResult.claims.admin === true,
      hasPendingVerification: !vSnap.empty,
      ready:true
    };

    // ── AUTO-CORREÇÃO DO NOME "—" ──
    // Causa: contas cujo signup ficou incompleto (ex: a criação do
    // utilizador no Firebase Auth foi bem sucedida no servidor, mas o
    // updateProfile()/bootstrapUserDocs() seguintes nunca chegaram a
    // correr no cliente, por exemplo por causa de uma ligação que
    // ficou pendurada) acabam com users/{uid}.name == '' — o campo
    // OFICIAL já usado por todo o projecto (não se cria nenhum campo
    // novo aqui). Sempre que detectamos essa lacuna e o Firebase
    // Authentication TEM um displayName, sincronizamos o valor real
    // para o Firestore, usando o mesmo caminho de escrita que o dono
    // já tem permissão para usar (rules: "name" é actualizável pelo
    // próprio). Isto corrige a exibição já nesta mesma sessão, sem
    // esperar por um novo login.
    if(AUTH.userDoc && !AUTH.userDoc.name && user.displayName){
      const fixedName = user.displayName;
      AUTH.userDoc.name = fixedName; // corrige já o ecrã actual
      if(AUTH.profileDoc && !AUTH.profileDoc.displayName){ AUTH.profileDoc.displayName = fixedName; }
      diagLog('SESSION STEP NAME-SYNC (users.name estava vazio, a sincronizar de Auth.displayName)');
      const nowSync = firebase.firestore.FieldValue.serverTimestamp();
      fdb.collection('users').doc(user.uid).update({ name: fixedName, updatedAt: nowSync })
        .catch(function(err){ console.error('Falha ao sincronizar nome (users):', err); });
      fdb.collection('profiles').doc(user.uid).update({ displayName: fixedName, updatedAt: nowSync })
        .catch(function(err){ console.error('Falha ao sincronizar nome (profiles):', err); });
    }

    diagLog('SESSION FLOW COMPLETE (loadAuthState)');
    renderTopbar(); buildNav(); render();
  });
}
fbAuth.onAuthStateChanged(function(user){
  diagLog('onAuthStateChanged FIRED', {hasUser: !!user});
  loadAuthState(user).catch(function(err){
    diagLog('SESSION FLOW FAILED (loadAuthState)', {code: err && err.code, message: err && err.message});
    console.error('Erro ao carregar estado de autenticação (detalhe completo):', err);
  });
});

function renderTopbar(){
  const el = document.getElementById('topRight');
  if(!AUTH.uid){
    el.innerHTML = `<button class="btn bo bsm" onclick="openAuth()">Entrar</button>`;
    return;
  }
  const initials = (AUTH.userDoc && AUTH.userDoc.name ? AUTH.userDoc.name : (AUTH.user.email||'?')).trim().charAt(0).toUpperCase();
  el.innerHTML = `
    <div class="icon-btn" title="Notificações">${icon('bell')}<span class="dot-badge"></span></div>
    <div class="icon-btn" title="Carrinho" onclick="go('comercio','carrinho')">${icon('cart')}</div>
    <div class="avatar" title="A tua conta" onclick="go('identidade','contas')">${initials}</div>`;
}

/* Auto-adiciona/remove um papel auto-atribuível. Nunca ADMIN — não existe
   sequer botão para isso na interface, e mesmo que existisse, a Firestore
   rule "allow update" recusa qualquer roles que contenha 'ADMIN'.
   Papéis comerciais (SELLER/SERVICE_PROVIDER/FREELANCER) nunca ficam
   ACTIVE aqui — só PENDING (a aguardar aprovação de um ADMIN via
   approveCommercialStatus), de volta a NONE se o pedido for cancelado
   antes de ser decidido, ou de volta a NONE se o utilizador se desligar
   de um papel já ACTIVE. Em nenhum caso este código escreve ACTIVE ou
   SUSPENDED. A própria Firestore rule também impõe isto de forma
   independente — mesmo que este código tivesse um erro, a regra
   recusaria qualquer tentativa de escrever ACTIVE, ou de sair de ACTIVE
   para outro valor que não seja NONE, a partir do cliente. */
const COMMERCIAL_ROLE_STATUS_FIELD = {SELLER:'sellerStatus', SERVICE_PROVIDER:'serviceProviderStatus', FREELANCER:'freelancerStatus'};
function toggleSelfRole(role, btnEl){
  if(!AUTH.uid){ openAuth(); return; }
  if(role==='ADMIN') return;
  // AFFILIATE deixou de ser um papel global auto-atribuível — a afiliação
  // passará a ser pedida por oferta/produto/serviço (Fase 2), não aqui.
  if(role==='AFFILIATE') return;
  const current = (AUTH.userDoc && AUTH.userDoc.roles) || ['CUSTOMER'];
  const statusField = COMMERCIAL_ROLE_STATUS_FIELD[role];
  const update = { updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
  let loaderMsg = 'A processar…', successMsg = 'Feito';

  if(!statusField){
    // Papel não-comercial (CUSTOMER): a única fonte de verdade é "roles".
    const has = current.includes(role);
    let next = has ? current.filter(function(r){return r!==role;}) : current.concat([role]);
    if(next.length===0) next = ['CUSTOMER'];
    update.roles = next;
    loaderMsg = has ? 'A desactivar papel…' : 'A activar papel…';
    successMsg = has ? 'Desactivado' : 'Activado';
  } else {
    // Papel comercial: a ÚNICA fonte de verdade é o estatuto comercial
    // real — o MESMO valor que a interface já usou para decidir qual
    // botão mostrar (ver render da página "Gerir papéis"). Nunca voltar
    // a recalcular "tenho ou não o papel" a partir de "roles" sozinho
    // aqui: se alguma vez divergissem, o botão que o utilizador vê e a
    // acção que este código executaria deixavam de corresponder um ao
    // outro — foi exactamente isso que causou "missing or insufficient
    // permissions" ao cancelar um pedido: o botão dizia "Cancelar" (via
    // commercialStatus==='PENDING'), mas este código, a decidir sozinho
    // a partir de roles.includes(role), podia concluir o contrário e
    // tentar ADICIONAR o papel em vez de o remover.
    const currentStatus = (AUTH.userDoc && AUTH.userDoc[statusField]) || 'NONE';
    const hasRoleInArray = current.includes(role);
    if(currentStatus==='NONE'){
      update.roles = hasRoleInArray ? current : current.concat([role]);
      update[statusField] = 'PENDING';
      loaderMsg = 'A enviar solicitação…'; successMsg = 'Enviado';
    } else if(currentStatus==='PENDING'){
      update.roles = hasRoleInArray ? current.filter(function(r){return r!==role;}) : current;
      update[statusField] = 'NONE';
      loaderMsg = 'A cancelar solicitação…'; successMsg = 'Cancelado';
    } else if(currentStatus==='ACTIVE'){
      update.roles = hasRoleInArray ? current.filter(function(r){return r!==role;}) : current;
      update[statusField] = 'NONE';
      loaderMsg = 'A desactivar papel…'; successMsg = 'Desactivado';
    } else {
      // SUSPENDED (ou qualquer valor inesperado): nada accionável pelo
      // cliente aqui — o próprio botão já vem desactivado nesse estado.
      return;
    }
    if(update.roles.length===0) update.roles = ['CUSTOMER'];
  }

  // Acção menor, por botão — nunca ocupa o ecrã inteiro (Loader Local).
  runWithLocalLoader(btnEl, loaderMsg, function(){
    return fdb.collection('users').doc(AUTH.uid).update(update);
  }, { successText: successMsg }).then(function(){
    if(update.roles) AUTH.userDoc.roles = update.roles;
    if(statusField && update[statusField]!==undefined) AUTH.userDoc[statusField] = update[statusField];
    buildNav(); render();
  }).catch(function(){ /* runWithLocalLoader já mostrou o erro real (toast) */ });
}

/* ── EDIÇÃO DE NOME ──
   Único campo editável aqui é "name" (users/{uid}) + "displayName"
   (profiles/{uid}) — ambos já permitidos ao dono pelas Firestore rules
   existentes, sem nenhuma alteração de regras. Nunca toca em email,
   status, verificationStatus, ipScore ou rating. */
function startEditName(){
  if(!AUTH.uid) return;
  const holder = document.getElementById('nameDisplay');
  if(!holder) return;
  const currentName = (AUTH.userDoc && AUTH.userDoc.name) || AUTH.user.displayName || '';
  holder.outerHTML = `<div id="nameDisplay">
    <input id="nameEditInput" type="text" value="${escHtml(currentName)}" maxlength="120"
      style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--g1);font-size:15px;box-sizing:border-box"/>
    <div style="margin-top:8px;display:flex;gap:8px">
      <button class="btn bv bsm" id="nameSaveBtn" onclick="saveEditName(this)">Guardar</button>
      <button class="btn bo bsm" onclick="render()">Cancelar</button>
    </div>
    <div class="auth-err" id="nameEditErr"></div>
  </div>`;
  const input = document.getElementById('nameEditInput');
  if(input){ input.focus(); input.select(); }
}
function saveEditName(btnEl){
  const input = document.getElementById('nameEditInput');
  const errEl = document.getElementById('nameEditErr');
  if(!input) return;
  const val = input.value.trim();
  if(!val){ if(errEl) errEl.textContent='O nome não pode ficar vazio.'; return; }
  if(errEl) errEl.textContent = '';
  const now = firebase.firestore.FieldValue.serverTimestamp();
  runWithLocalLoader(btnEl, 'A guardar alterações…', function(){
    return fdb.collection('users').doc(AUTH.uid).update({ name: val, updatedAt: now })
      .then(function(){ return fdb.collection('profiles').doc(AUTH.uid).update({ displayName: val, updatedAt: now }); });
  }, { successText: 'Guardado' }).then(function(){
    if(AUTH.userDoc) AUTH.userDoc.name = val;
    if(AUTH.profileDoc) AUTH.profileDoc.displayName = val;
    render();
  }).catch(function(err){
    if(errEl) errEl.textContent = 'Não foi possível guardar: ' + friendlyErrorMessage(err);
  });
}

/* ── EDIÇÃO DE TELEFONE ──
   Mesmo padrão da edição de nome. Único campo tocado é "phone" em
   users/{uid} — já permitido ao dono pelas Firestore rules existentes,
   sem nenhuma alteração de regras. Validação simples do lado do
   cliente (comprimento mínimo); a regra de segurança real continua a
   ser a das rules, não esta validação. */
function startEditPhone(){
  if(!AUTH.uid) return;
  const holder = document.getElementById('phoneDisplay');
  if(!holder) return;
  const currentPhone = (AUTH.userDoc && AUTH.userDoc.phone) || '';
  holder.outerHTML = `<div id="phoneDisplay">
    <input id="phoneEditInput" type="tel" value="${escHtml(currentPhone)}" maxlength="20" placeholder="+244 9xx xxx xxx"
      style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--g1);font-size:15px;box-sizing:border-box"/>
    <div style="margin-top:8px;display:flex;gap:8px">
      <button class="btn bv bsm" id="phoneSaveBtn" onclick="savePhone(this)">Guardar</button>
      <button class="btn bo bsm" onclick="render()">Cancelar</button>
    </div>
    <div class="auth-err" id="phoneEditErr"></div>
  </div>`;
  const input = document.getElementById('phoneEditInput');
  if(input){ input.focus(); }
}
function savePhone(btnEl){
  const input = document.getElementById('phoneEditInput');
  const errEl = document.getElementById('phoneEditErr');
  if(!input) return;
  const val = input.value.trim();
  if(val && val.replace(/[^0-9]/g,'').length < 9){
    if(errEl) errEl.textContent = 'Número de telefone demasiado curto.';
    return;
  }
  if(errEl) errEl.textContent = '';
  const now = firebase.firestore.FieldValue.serverTimestamp();
  runWithLocalLoader(btnEl, 'A guardar alterações…', function(){
    return fdb.collection('users').doc(AUTH.uid).update({ phone: val, updatedAt: now });
  }, { successText: 'Guardado' }).then(function(){
    if(AUTH.userDoc) AUTH.userDoc.phone = val;
    render();
  }).catch(function(err){
    if(errEl) errEl.textContent = 'Não foi possível guardar: ' + friendlyErrorMessage(err);
  });
}

   de documento e os nomes de ficheiro escolhidos ficam só no ecrã, para

let VERIF_FORM = { docType:'', frontName:'', backName:'' };

function onVerifDocTypeChange(sel){

  render();
}
function onVerifFileChange(which, input){
  VERIF_FORM[which+'Name'] = (input.files && input.files[0]) ? input.files[0].name : '';

function submitVerificationRequest(btnEl){
  if(!VERIF_FORM.docType){ alert('Escolhe o tipo de documento antes de submeter.'); return; }

function requestVerification(btnEl){
  if(!AUTH.uid){ openAuth(); return; }
  if(AUTH.hasPendingVerification || (AUTH.userDoc && AUTH.userDoc.verificationStatus==='VERIFIED')) return;

/* ══════════════════════════════════════════════════════════════
   SISTEMA CENTRAL DE LOADING — IP Digital AO
   Fonte única de verdade. UM ÚNICO componente visual oficial
   (badge "IP" + anel verde a girar), em duas escalas:

   A) GLOBAL — ecrã inteiro: badge + anel + wordmark "IP DIGITAL.AO" +
      barra indeterminada. Só para operações críticas/bloqueantes:
      autenticação, criação de conta, recuperação de senha, bootstrap
      de sessão, operações administrativas importantes.
   B) LOCAL / MINIMIZADO — badge + anel reduzidos, inline no próprio
      botão/componente, sem wordmark nem barra (não cabem à escala).
      Para acções menores: guardar nome/telefone, activar/cancelar/
      desactivar papel, pedir verificação, logout, aprovar/rejeitar.

   Nenhuma das duas é um design à parte — B é literalmente uma redução
   de A (mesmo badge, mesmo anel, mesma cor). Nunca spinner genérico,
   nunca emoji, nunca outro símbolo.

   C) SKELETON — placeholders de conteúdo (não acções), sistema à
      parte, preparado para o redesign, não usado ainda nesta fase.

   Nenhuma operação Firebase desta fase deve inventar o próprio
   spinner — todas passam por aqui. Nunca usa setTimeout para fingir
   que uma operação terminou: o loader só desaparece quando a Promise
   REAL resolve ou rejeita (sempre via .finally()). ══════════════════════════════════════════════════════════════ */

/* ── A) GLOBAL ── */
let GL_OPEN_COUNT = 0;
function showGlobalLoader(message){
  GL_OPEN_COUNT++;
  const overlay = document.getElementById('globalLoader');
  const msgEl = document.getElementById('globalLoaderMsg');
  if(msgEl) msgEl.textContent = message || 'Carregando...';
  if(overlay){ overlay.classList.add('open'); overlay.setAttribute('aria-hidden','false'); }
}
function hideGlobalLoader(){
  GL_OPEN_COUNT = Math.max(0, GL_OPEN_COUNT - 1);
  if(GL_OPEN_COUNT > 0) return; // outra operação global ainda em curso — não esconde por baixo dela
  const overlay = document.getElementById('globalLoader');
  if(overlay){ overlay.classList.remove('open'); overlay.setAttribute('aria-hidden','true'); }
}
function friendlyErrorMessage(err){
  const code = err && err.code;
  const msg = err && err.message;
  if(code==='auth/network-request-failed' || code==='unavailable' || code==='deadline-exceeded' || (msg && /network/i.test(msg))){
    return 'Sem conexão. Verifica a tua internet.';
  }
  return msg || code || 'Erro desconhecido.';
}
function showGlobalToast(message, isError){
  const el = document.getElementById('globalToast');
  if(!el) return;
  el.textContent = message;
  el.className = 'gtoast ' + (isError?'gtoast-err':'gtoast-ok');
  void el.offsetWidth; // reflow forçado — reinicia a transição mesmo em toasts consecutivos
  el.classList.add('show');
  clearTimeout(window.__gtoastTimer);
  window.__gtoastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2800);
}
/* runWithGlobalLoader(message, action, okMessage?)
   Para operações críticas/bloqueantes. Não recebe botão — por
   definição, bloqueia a interface inteira enquanto corre.

   Anti-flicker (secção 8): a operação arranca de imediato, mas o
   overlay só aparece se ainda estiver a decorrer passados
   GL_MIN_DELAY_MS. Isto NUNCA altera a duração real da operação —
   só atrasa a exibição visual, para não "piscar" em pedidos rápidos.
   Se a Promise já tiver resolvido/rejeitado antes do temporizador
   disparar, o loader nunca chega a aparecer. */
const GL_MIN_DELAY_MS = 160;
function runWithGlobalLoader(message, action, okMessage){
  let settled = false;
  let shown = false;
  const delayTimer = setTimeout(function(){
    if(settled) return;
    shown = true;
    showGlobalLoader(message);
  }, GL_MIN_DELAY_MS);
  return Promise.resolve().then(action)
    .then(function(result){
      if(okMessage) showGlobalToast(okMessage, false);
      return result;
    })
    .catch(function(err){
      console.error(message, err);
      showGlobalToast('Não foi possível concluir: ' + friendlyErrorMessage(err), true);
      throw err;
    })
    .finally(function(){
      settled = true;
      clearTimeout(delayTimer);
      if(shown) hideGlobalLoader();
    });
}

/* ── B) LOCAL / MINIMIZADO — mesmo Loader Principal, escala reduzida ──
   Mostra o cartão flutuante #localLoader (mesma marcação/classes do
   Loader Principal) centrado sobre o ecrã, sem escurecer o fundo. O
   botão que despoletou a acção fica apenas desactivado (aria-busy +
   dataset.glBusy) — já não troca o próprio conteúdo, porque quem
   mostra o estado de "a processar" é sempre o mesmo componente visual
   oficial, nunca o botão a inventar o seu próprio spinner. Guarda de
   duplo clique via dataset.glBusy — o SEGUNDO clique é ignorado
   enquanto o primeiro ainda corre. */
function showLocalLoader(btnEl, processingText){
  if(btnEl && btnEl.dataset.glBusy==='1') return;
  if(btnEl){
    btnEl.dataset.glBusy = '1';
    btnEl.disabled = true;
    btnEl.setAttribute('aria-busy','true');
  }
  const overlay = document.getElementById('localLoader');
  const msgEl = document.getElementById('localLoaderMsg');
  if(msgEl) msgEl.textContent = processingText || 'A processar…';
  if(overlay){ overlay.classList.add('open'); overlay.setAttribute('aria-hidden','false'); }
}
function hideLocalLoader(btnEl){
  if(btnEl){
    btnEl.disabled = false;
    btnEl.removeAttribute('aria-busy');
    delete btnEl.dataset.glBusy;
  }
  const overlay = document.getElementById('localLoader');
  if(overlay){ overlay.classList.remove('open'); overlay.setAttribute('aria-hidden','true'); }
}
/* runWithLocalLoader(btnEl, processingText, action, opts?)
   opts.successText    — texto breve mostrado NO PRÓPRIO cartão do loader
     antes de o esconder (ex: "Guardado"), para dar confirmação visual
     sem precisar de um toast à parte.
   opts.toastOnSuccess  — opcional, toast adicional.
   opts.onError(err)    — se dado, chamado com o erro real (para os casos
     que já têm um campo de erro inline próprio, como nome/telefone);
     caso contrário mostra o toast genérico de erro.
   Nunca usa setTimeout para decidir QUANDO a operação termina — a
   Promise real (action) é sempre a única fonte de verdade sobre
   sucesso/erro. O único setTimeout existe DEPOIS de a Promise já ter
   resolvido, só para deixar a mensagem de sucesso visível por um
   instante antes de esconder o cartão — não afecta a duração real. */
function runWithLocalLoader(btnEl, processingText, action, opts){
  opts = opts || {};
  if(btnEl && btnEl.dataset.glBusy==='1') return Promise.resolve(); // duplo clique — ignora
  showLocalLoader(btnEl, processingText);
  return Promise.resolve().then(action)
    .then(function(result){
      if(opts.successText){
        const msgEl = document.getElementById('localLoaderMsg');
        if(msgEl) msgEl.textContent = opts.successText;
        return new Promise(function(resolve){
          setTimeout(function(){
            hideLocalLoader(btnEl);
            if(opts.toastOnSuccess) showGlobalToast(opts.toastOnSuccess, false);
            resolve(result);
          }, 700);
        });
      }
      hideLocalLoader(btnEl);
      if(opts.toastOnSuccess) showGlobalToast(opts.toastOnSuccess, false);
      return result;
    })
    .catch(function(err){
      hideLocalLoader(btnEl);
      console.error(processingText, err);
      if(opts.onError) opts.onError(err);
      else showGlobalToast('Não foi possível concluir: ' + friendlyErrorMessage(err), true);
      throw err;
    });
}

/* ── C) SKELETON (preparado, não usado ainda em nenhuma página real) ── */
function showSkeleton(containerEl, opts){
  if(!containerEl) return;
  opts = opts || {};
  const rows = opts.rows || 3;
  containerEl.dataset.skelPrev = containerEl.innerHTML;
  let html = '';
  for(let i=0; i<rows; i++){
    html += '<div class="skel-card" style="margin-bottom:10px">'
      + '<div class="skel skel-line w-40"></div>'
      + '<div class="skel skel-line w-80"></div>'
      + '<div class="skel skel-line w-60"></div>'
      + '</div>';
  }
  containerEl.innerHTML = html;
  containerEl.setAttribute('aria-busy','true');
}
function hideSkeleton(containerEl, restoreHtml){
  if(!containerEl) return;
  containerEl.removeAttribute('aria-busy');
  if(restoreHtml !== undefined){ containerEl.innerHTML = restoreHtml; }
  else if(containerEl.dataset.skelPrev !== undefined){ containerEl.innerHTML = containerEl.dataset.skelPrev; delete containerEl.dataset.skelPrev; }
}
function verificationLabel(){
  const status = (AUTH.userDoc && AUTH.userDoc.verificationStatus) || 'UNVERIFIED';
  if(AUTH.hasPendingVerification && status!=='VERIFIED') return 'Pendente de revisão';
  return {UNVERIFIED:'Não verificado', PENDING:'Pendente de revisão', VERIFIED:'Verificado', REJECTED:'Rejeitado — podes tentar de novo'}[status] || status;
}
function loginGate(msg){
  return `<div class="gate-card"><div class="gi">${icon('lock')}</div><div class="card-tit" style="font-size:15px;margin-bottom:8px">Precisas de sessão iniciada</div><div class="card-desc" style="margin-bottom:16px">${escHtml(msg)}</div><button class="btn bv" onclick="openAuth()">Entrar ou criar conta</button></div>`;
}
function mockNote(txt){
  return `<div class="mock-note">🧪 <div><b>Protótipo estrutural</b> — ${txt} Sem Firebase, sem pagamentos reais, sem escrita de saldo. Serve para validar fluxo e arquitectura de informação.</div></div>`;
}
function crumb(sec,sub){ return `<div class="crumb">${NAV[sec].label} / ${NAV[sec].subs[sub]}</div>`; }
function emptyState(icon,title,desc){
  return `<div class="empty"><div class="ei">${icon}</div><div class="tit" style="color:#fff;margin-bottom:6px;font-size:15px">${title}</div><p>${desc}</p></div>`;

/* ── RENDER POR SECÇÃO/SUB ── */
function render(){
  // ═══ GATE REAL DE SEGURANÇA — não é só esconder o botão do menu ═══
  // ST.section é inicializado directamente a partir de localStorage
  // (linha ~528), sem passar por go(). Isso significa que se
  // 'administracao' ficou gravado no localStorage de uma sessão anterior
  // (ex: a conta já foi admin, ou alguém editou o localStorage à mão),
  // o CONTEÚDO administrativo seria desenhado mesmo para quem não é admin
  // agora — mesmo com o item do menu escondido por buildNav(). Este gate
  // corre em TODO render(), não só nos cliques de navegação (go()), por
  // isso cobre também o carregamento inicial da página.
  // Antes de AUTH.ready==true não sabemos ainda se é admin — nesse caso
  // mostra-se algo seguro (Identidade) sem apagar o valor persistido,
  // para não perder a rota de um admin real só por causa do atraso do
  // primeiro load. Só se grava a correcção definitiva no localStorage
  // depois de AUTH.ready confirmar que a conta NÃO é admin.
  const blockedAdminRoute = ST.section==='administracao' && !(AUTH.ready && AUTH.isAdmin===true);
  const section = blockedAdminRoute ? 'identidade' : ST.section;
  const sub = blockedAdminRoute ? 'contas' : ST.sub;
  if(blockedAdminRoute && AUTH.ready){
    ST.section='identidade'; ST.sub='contas';
    localStorage.setItem('ipd2_sec','identidade');
    localStorage.setItem('ipd2_sub','contas');
  }
  const el = document.getElementById('content');
  el.innerHTML = crumb(section,sub) + `<h1 class="page-tit">${NAV[section].subs[sub]}</h1>` + renderBody(section,sub) ;
}

function renderBody(sec,sub){
  const key = sec+':'+sub;
  const R = RENDERERS[key];
  if(R) return R();
  return `<p class="page-sub">Módulo por especificar.</p>` + emptyState('🧩','Ainda não definido','Este ecrã aparece na IA mas o comportamento ainda não foi especificado no briefing de negócio.');
}

function heroSection(){
  return `<section class="mkt-hero">
    <h1 class="mkt-hero-title">Compra e vende produtos digitais com confiança</h1>
    <p class="mkt-hero-sub">A IP Digital AO liga vendedores aprovados a compradores em Angola — pagamento acompanhado, entrega só depois de confirmada.</p>
  </section>`;
}
function categoriasSection(){
  const cats = [
    {label:'Digital', desc:'Disponível agora', cls:'active'},
    {label:'Físico', desc:'Brevemente', cls:'soon'},
    {label:'Serviços', desc:'Brevemente', cls:'soon'},
    {label:'Freelancers', desc:'Brevemente', cls:'soon'}
  ];
  return `<div class="mkt-cats">
    ${cats.map(function(c){ return `<div class="mkt-cat ${c.cls}">${escHtml(c.label)}<span>${escHtml(c.desc)}</span></div>`; }).join('')}
  </div>`;
}
function comoFuncionaSection(){
  const steps = [
    {t:'Encontra', d:'Explora os produtos digitais publicados por vendedores já aprovados.'},
    {t:'Escolhe', d:'Vê o preço e o que está incluído antes de avançar.'},
    {t:'Compra', d:'Fazes o pedido através da própria plataforma.'},
    {t:'Recebe', d:'O acesso é liberado assim que o pagamento é confirmado.'}
  ];
  return `<section class="mkt-info">
    <h2 class="mkt-info-title">Como funciona</h2>
    <div class="mkt-steps">
      ${steps.map(function(s,i){ return `<div class="mkt-step"><div class="mkt-step-n">${i+1}</div><div class="mkt-step-t">${escHtml(s.t)}</div><div class="mkt-step-d">${escHtml(s.d)}</div></div>`; }).join('')}
    </div>
  </section>`;
}
function confiancaSection(){
  const items = [
    'Vendedores só publicam depois de aprovação de um Administrador',
    'O pagamento fica associado ao pedido e é confirmado antes da entrega',
    'O acesso ao produto só é liberado depois da confirmação — nunca antes',
    'O acesso aos teus dados é protegido por regras do sistema, não só pela interface'
  ];
  return `<section class="mkt-info">
    <h2 class="mkt-info-title">Porque podes confiar</h2>
    <ul class="mkt-trust-list">
      ${items.map(function(i){ return `<li>${escHtml(i)}</li>`; }).join('')}
    </ul>
  </section>`;
}

/* Cache simples por chave + de-dupe de pedidos em curso. Invalidado por
   inteiro sempre que o utilizador muda (login/logout/troca de conta),
   via um SEGUNDO listener de auth (abaixo) — não mexe no listener já
   existente da Fase 1. */
const V1 = { cache:{}, loading:{} };
function v1Fetch(key, queryFn){
  if(V1.cache[key]!==undefined || V1.loading[key]) return;
  V1.loading[key] = true;
  queryFn().then(function(snap){
    V1.cache[key] = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
  }).catch(function(err){
    console.error('[V1] erro a carregar '+key, err);
    V1.cache[key] = [];
    showGlobalToast('Não foi possível carregar dados: ' + friendlyErrorMessage(err), true);
  }).finally(function(){
    V1.loading[key] = false;
    render();
  });
}
function v1Invalidate(key){ delete V1.cache[key]; }
fbAuth.onAuthStateChanged(function(){ V1.cache = {}; V1.loading = {}; });

};

/* ══════ COMÉRCIO › MINHAS OFERTAS (vendedor) ══════ */
let V1_novaOfertaOpen = false;
function toggleNovaOferta(){ V1_novaOfertaOpen = !V1_novaOfertaOpen; render(); }
function criarOferta(btnEl){
  const titulo = (document.getElementById('novaOfertaTitulo').value||'').trim();
  const descricao = (document.getElementById('novaOfertaDesc').value||'').trim();
  const preco = parseFloat(document.getElementById('novaOfertaPreco').value);
  const errEl = document.getElementById('novaOfertaErr');
  errEl.textContent = '';
  if(!titulo){ errEl.textContent = 'Indica um título.'; return; }
  if(!preco || preco<=0){ errEl.textContent = 'Indica um preço válido (maior que 0).'; return; }
  const now = firebase.firestore.FieldValue.serverTimestamp();
  runWithLocalLoader(btnEl, 'A guardar oferta…', function(){
    return fdb.collection('ofertas').add({
      vendedorId: AUTH.uid, titulo, descricao, preco, moeda: 'AOA',
      estado: 'RASCUNHO', criadoEm: now, atualizadoEm: now
    });
  }, { successText:'Oferta criada' })
  .then(function(){ V1_novaOfertaOpen = false; v1Invalidate('minhasOfertas'); render(); })
  .catch(function(){});
}
function submeterOfertaParaAprovacao(oid, btnEl){
  runWithLocalLoader(btnEl, 'A submeter…', function(){
    return fdb.collection('ofertas').doc(oid).update({ estado:'AGUARDA_APROVACAO', atualizadoEm: firebase.firestore.FieldValue.serverTimestamp() });
  }, { successText:'Submetida para aprovação' })
  .then(function(){ v1Invalidate('minhasOfertas'); render(); })
  .catch(function(){});
}

  if(!isSellerApproved()){

      <div class="card-tit" style="font-size:15px;margin-bottom:8px">Precisas de ser Vendedor aprovado</div>

  return `<p class="page-sub">Cria e gere os teus produtos digitais. A entrega (link/ficheiro) é configurada pelo Admin depois da aprovação.</p>
  <button class="btn bv bsm" style="margin-bottom:16px" onclick="toggleNovaOferta()">${V1_novaOfertaOpen?'Fechar':'+ Nova oferta'}</button>
  ${V1_novaOfertaOpen ? `
  <div class="card" style="margin-bottom:20px;max-width:420px">
    <input class="auth-input" id="novaOfertaTitulo" placeholder="Título do produto digital">
    <textarea class="auth-input" id="novaOfertaDesc" placeholder="Descrição" rows="3"></textarea>
    <input class="auth-input" id="novaOfertaPreco" type="number" min="1" placeholder="Preço em Kz">

  ${!ofertas.length ? emptyState('📦','Ainda não tens ofertas','Cria a tua primeira oferta acima.') : `
  <div class="grid">
    ${ofertas.map(function(o){
      return `<div class="card">
        <div class="card-tit">${escHtml(o.titulo)}</div>
        <div class="card-desc">${escHtml(o.descricao||'')}</div>
        <div class="card-foot"><span>${fmt(o.preco)} Kz</span><span class="pill ${estadoPill[o.estado]||'pill-n'}">${estadoLabel[o.estado]||o.estado}</span></div>
        ${(o.estado==='RASCUNHO'||o.estado==='REJEITADA') ? `<button class="btn bo bsm" style="margin-top:10px;width:100%" onclick="submeterOfertaParaAprovacao('${o.id}', this)">Submeter para aprovação</button>` : ''}
      </div>`;
    }).join('')}
  </div>`}`;
};

/* ══════ COMPRA (checkout directo, sem carrinho — simplicidade V1) ══════ */
function comprarOferta(ofertaId, btnEl){
  if(!AUTH.uid){ openAuth(); return; }
  const ofertaRef = fdb.collection('ofertas').doc(ofertaId);
  const pedidoRef = fdb.collection('pedidos').doc();
  runWithLocalLoader(btnEl, 'A criar pedido…', function(){
    return fdb.runTransaction(function(tx){
      return tx.get(ofertaRef).then(function(oSnap){
        if(!oSnap.exists) throw new Error('Esta oferta já não existe.');
        const o = oSnap.data();
        if(o.estado!=='PUBLICADA') throw new Error('Esta oferta já não está disponível.');
        const now = firebase.firestore.FieldValue.serverTimestamp();
        tx.set(pedidoRef, {
          compradorId: AUTH.uid, vendedorId: o.vendedorId, ofertaId: ofertaId,
          tituloSnapshot: o.titulo, valor: o.preco, moeda: o.moeda||'AOA',
          estado: 'CRIADO', pagamento: null, linkEntregue: null,
          criadoEm: now, atualizadoEm: now
        });
      });
    });
  }, { successText:'Pedido criado' })
  .then(function(){ v1Invalidate('meusPedidos'); go('comercio','pedidos'); })
  .catch(function(){});
}

RENDERERS['comercio:pedidos'] = function(){
  if(!AUTH.uid) return loginGate('Entra para veres os teus pedidos.');
  const key = 'meusPedidos';
  if(V1.cache[key]===undefined){
    v1Fetch(key, function(){ return fdb.collection('pedidos').where('compradorId','==',AUTH.uid).orderBy('criadoEm','desc').get(); });
    return skeletonGrid();
  }
  const pedidos = V1.cache[key];
  const estadoLabel = {CRIADO:'Criado — aguarda cobrança', AGUARDA_PAGAMENTO:'Aguarda pagamento', PAGO:'Pago', ENTREGUE:'Entregue', FALHOU:'Falhou', CANCELADO:'Cancelado'};
  if(!pedidos.length) return emptyState('🧾','Ainda não tens pedidos','Compra um produto em Marketplace → Digital.');
  return `<div class="table-wrap"><table><thead><tr><th>Produto</th><th>Valor</th><th>Estado</th><th>Entrega</th></tr></thead><tbody>
  ${pedidos.map(function(p){
    const okState = p.estado==='ENTREGUE'||p.estado==='PAGO';
    const badState = p.estado==='FALHOU'||p.estado==='CANCELADO';
    return `<tr><td>${escHtml(p.tituloSnapshot)}</td><td>${fmt(p.valor)} ${escHtml(p.moeda)}</td>
      <td><span class="pill ${okState?'pill-g':badState?'pill-r':'pill-v'}">${estadoLabel[p.estado]||p.estado}</span></td>
      <td>${(p.estado==='ENTREGUE' && p.linkEntregue) ? `<a href="${escHtml(p.linkEntregue)}" target="_blank" rel="noopener" style="color:var(--vlt)">Descarregar</a>` : '—'}</td></tr>`;
  }).join('')}
  </tbody></table></div>`;
};

  if(!regs.length) return emptyState('💰','Ainda sem vendas confirmadas','Assim que um pedido teu for pago, o valor devido aparece aqui.');
  const devido = function(r){ return r.valorDevidoVendedor!==undefined ? r.valorDevidoVendedor : r.valorVenda; };

  ${v1Note('registo de consulta apenas — sem saque nem transferência self-service. Liquidação é feita fora da app pelo Admin nesta fase.')}`;
};

/* ══════ ADMINISTRAÇÃO › PEDIDOS (transições reais) ══════ */
function adminAnexarCobranca(pid, btnEl){
  const chargeId = prompt('ID da cobrança AppyPay (charge ID):');
  if(!chargeId) return;
  const referencia = prompt('Referência de pagamento (opcional):') || '';
  runWithLocalLoader(btnEl, 'A associar cobrança…', function(){
    const now = firebase.firestore.FieldValue.serverTimestamp();
    return fdb.collection('pedidos').doc(pid).update({
      estado: 'AGUARDA_PAGAMENTO',
      pagamento: { gateway:'appypay', chargeId:chargeId, referencia:referencia, estadoGateway:'PENDING', valor:null, moeda:'AOA', criadoEm:now, atualizadoEm:now },
      atualizadoEm: now
    });
  }, { successText:'Associado' })
  .then(function(){ v1Invalidate('todosPedidosAdmin'); render(); })
  .catch(function(){});
}
const COMISSAO_IP_PERCENT = 0.20; // 20% — fixado por ordem explícita; não alterar sem nova ordem

function adminMarcarPago(pid, vendedorId, valor, moeda, chargeId, btnEl){
  const pedidoRef = fdb.collection('pedidos').doc(pid);
  // ID determinístico = pedidoId: mesmo que esta acção seja disparada
  // duas vezes (dois separadores, dois Admins), só pode existir UM
  // registoFinanceiros para este pedido — a segunda tentativa é travada
  // pela verificação de estado dentro da própria transacção, não pela
  // colisão de ID (que só evitaria reescrever, não recusar).
  const registoRef = fdb.collection('registosFinanceiros').doc(pid);
  runWithLocalLoader(btnEl, 'A confirmar pagamento…', function(){
    return fdb.runTransaction(function(tx){
      return tx.get(pedidoRef).then(function(pSnap){
        if(!pSnap.exists) throw new Error('Este pedido já não existe.');
        const p = pSnap.data();
        if(p.estado !== 'AGUARDA_PAGAMENTO') throw new Error('Este pedido já foi processado (estado actual: ' + p.estado + ').');
        const now = firebase.firestore.FieldValue.serverTimestamp();
        // Comissão calculada aqui, uma única vez, no momento em que o
        // registo nasce — nunca recalculada depois, para o valor devido
        // não mudar se a percentagem for alterada no futuro.
        const comissaoIP = Math.round(valor * COMISSAO_IP_PERCENT * 100) / 100;
        const valorDevidoVendedor = Math.round((valor - comissaoIP) * 100) / 100;
        tx.update(pedidoRef, { estado:'PAGO', 'pagamento.estadoGateway':'PAID', 'pagamento.atualizadoEm':now, atualizadoEm:now });
        tx.set(registoRef, { pedidoId:pid, vendedorId:vendedorId, valorVenda:valor, comissaoIP:comissaoIP, valorDevidoVendedor:valorDevidoVendedor, moeda:moeda||'AOA', estado:'DEVIDO', referenciaPagamento:chargeId||null, criadoEm:now });
      });
    });
  }, { successText:'Marcado como pago' })
  .then(function(){ v1Invalidate('todosPedidosAdmin'); v1Invalidate('todosRegistosFinanceiros'); render(); })
  .catch(function(){});
}

function adminEntregarPedido(pid, ofertaId, btnEl){
  const pedidoRef = fdb.collection('pedidos').doc(pid);
  const privadoRef = fdb.collection('ofertasPrivado').doc(ofertaId);
  runWithLocalLoader(btnEl, 'A liberar entrega…', function(){
    // Transação: lê pedido + ofertasPrivado, confirma PAGO e link válido,
    // só depois escreve — nunca há um estado intermédio em que o pedido
    // fica ENTREGUE sem link, nem uma leitura parcial fica visível.
    return fdb.runTransaction(function(tx){
      return Promise.all([tx.get(pedidoRef), tx.get(privadoRef)]).then(function(results){
        const pSnap = results[0], privSnap = results[1];
        if(!pSnap.exists) throw new Error('Este pedido já não existe.');
        const p = pSnap.data();
        if(p.estado !== 'PAGO') throw new Error('Este pedido já não está em estado Pago.');
        const link = privSnap.exists ? (privSnap.data().linkEntrega || '').trim() : '';
        if(!link) throw new Error('Esta oferta ainda não possui um link de entrega configurado.');
        tx.update(pedidoRef, { estado:'ENTREGUE', linkEntregue: link, atualizadoEm: firebase.firestore.FieldValue.serverTimestamp() });
      });
    });
  }, { successText:'Entregue' })
  .then(function(){ v1Invalidate('todosPedidosAdmin'); v1Invalidate('meusPedidos'); render(); })
  .catch(function(){});
}

/* ══════ ADMIN — CONFIGURAR ENTREGA (ofertasPrivado) ══════
   Único ponto da app que lê/escreve ofertasPrivado a partir da UI.
   A barreira real é a Firestore rule (isAdmin() via custom claim) —
   este modal só existe dentro de Administração → Ofertas, que já é
   secção gated a Admin; mesmo assim, qualquer tentativa de escrita
   por um não-Admin seria recusada pelo servidor. */
function openConfigurarEntrega(ofertaId, titulo, vendedorId){
  document.getElementById('entregaOfertaId').textContent = ofertaId;
  document.getElementById('entregaOfertaTitulo').textContent = titulo;
  document.getElementById('entregaOfertaVendedor').textContent = vendedorId;
  document.getElementById('entregaLinkInput').value = '';
  document.getElementById('entregaErr').textContent = '';
  document.getElementById('entregaSubmitBtn').dataset.ofertaId = ofertaId;
  document.getElementById('entregaOverlay').classList.add('open');
  // Pré-preenche com o link já guardado, se existir — só Admin consegue
  // esta leitura (rule), por isso é seguro fazê-la aqui.
  fdb.collection('ofertasPrivado').doc(ofertaId).get().then(function(snap){
    if(snap.exists && snap.data().linkEntrega){
      document.getElementById('entregaLinkInput').value = snap.data().linkEntrega;
    }
  }).catch(function(err){
    console.error('Erro ao carregar ofertasPrivado', err);
  });
}
function closeConfigurarEntrega(){
  document.getElementById('entregaOverlay').classList.remove('open');
  document.getElementById('entregaErr').textContent = '';
}
function guardarLinkEntrega(btnEl){
  const ofertaId = document.getElementById('entregaSubmitBtn').dataset.ofertaId;
  const raw = (document.getElementById('entregaLinkInput').value || '').trim();
  const errEl = document.getElementById('entregaErr');
  errEl.style.color = 'var(--red)';
  errEl.textContent = '';
  if(!raw){ errEl.textContent = 'O link de entrega é obrigatório.'; return; }
  let parsed;
  try{ parsed = new URL(raw); }catch(e){ parsed = null; }
  if(!parsed || (parsed.protocol!=='http:' && parsed.protocol!=='https:')){
    errEl.textContent = 'Indica uma URL válida (a começar por http:// ou https://).';
    return;
  }
  runWithLocalLoader(btnEl, 'A guardar link de entrega…', function(){
    return fdb.collection('ofertasPrivado').doc(ofertaId).set({
      linkEntrega: parsed.href,
      atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  }, { successText:'Link guardado' })
  .then(function(){ closeConfigurarEntrega(); })
  .catch(function(err){ errEl.textContent = friendlyErrorMessage(err); });
}

/* ══════ ADMINISTRAÇÃO › UTILIZADORES — pedidos de activação de papel
   comercial (SELLER/SERVICE_PROVIDER/FREELANCER), pendentes de decisão.
   Chama approveCommercialStatus (Cloud Function) — nunca escreve
   sellerStatus/etc. directamente a partir do cliente. Distinto da
   verificação de identidade (Identidade → Verificação), que é outro
   fluxo e não foi tocado aqui. ══════ */
const COMMERCIAL_ROLE_LABEL = { SELLER:'Vendedor', SERVICE_PROVIDER:'Prestador de Serviço', FREELANCER:'Freelancer' };
function adminDecidirPapelComercial(uid, role, status, btnEl){
  runWithLocalLoader(btnEl, status==='ACTIVE' ? 'A aprovar…' : 'A rejeitar…', function(){
    return fbFunctions.httpsCallable('approveCommercialStatus')({ uid: uid, role: role, status: status });
  }, { successText: status==='ACTIVE' ? 'Aprovado' : 'Rejeitado' })
  .then(function(){ v1Invalidate('papeisComerciaisPendentes'); render(); })
  .catch(function(){});
}
RENDERERS['administracao:utilizadores'] = function(){
  const key = 'papeisComerciaisPendentes';
  if(V1.cache[key]===undefined){
    v1Fetch(key, function(){
      // Três queries de campo único (sem índice composto) em vez de
      // carregar toda a colecção users — só o que realmente precisa de
      // decisão do Admin.
      return Promise.all([
        fdb.collection('users').where('sellerStatus','==','PENDING').get(),
        fdb.collection('users').where('serviceProviderStatus','==','PENDING').get(),
        fdb.collection('users').where('freelancerStatus','==','PENDING').get()
      ]).then(function(snaps){
        const out = [];
        const fields = ['sellerStatus','serviceProviderStatus','freelancerStatus'];
        const roles = ['SELLER','SERVICE_PROVIDER','FREELANCER'];
        snaps.forEach(function(snap, i){
          snap.docs.forEach(function(d){
            out.push({ uid:d.id, role:roles[i], field:fields[i], nome:d.data().name||d.data().email||d.id, email:d.data().email||'' });
          });
        });
        return { docs: out.map(function(o){ return { id:o.uid+':'+o.role, data:function(){ return o; } }; }) };
      });
    });
    return skeletonGrid();
  }
  const pendentes = V1.cache[key];
  if(!pendentes.length) return emptyState('✅','Sem pedidos de papel comercial pendentes','Quando alguém solicitar Vendedor, Prestador de Serviço ou Freelancer, aparece aqui.');
  return `<p class="page-sub">Pedidos de activação de papel comercial — separado da verificação de identidade.</p>
  <div class="table-wrap"><table><thead><tr><th>Utilizador</th><th>Papel solicitado</th><th></th></tr></thead><tbody>
  ${pendentes.map(function(p){
    return `<tr><td>${escHtml(p.nome)}${p.email?` <span style="color:var(--g3lt);font-size:11.5px">(${escHtml(p.email)})</span>`:''}</td><td><span class="pill pill-v">${COMMERCIAL_ROLE_LABEL[p.role]||p.role}</span></td><td style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn bv bsm" onclick="adminDecidirPapelComercial('${p.uid}','${p.role}','ACTIVE',this)">Aprovar</button><button class="btn bo bsm" onclick="adminDecidirPapelComercial('${p.uid}','${p.role}','NONE',this)">Rejeitar</button></td></tr>`;
  }).join('')}
  </tbody></table></div>`;
};
